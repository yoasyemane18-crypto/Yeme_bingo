<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YEME BINGO</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#f4f8fb;--card:#fff;--navy:#1e3a5f;--ink:#26323f;--mut:#5d6b7a;--purple:#351c63;--green:#36a420;--lg:#dcedde;--lgb:#a9d3a4;--line:#c9d6e6;--cell:#ececee;--hd:#d5e0d3;--gold:#f5b82e;--ok:#1f9d6b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18222c;--navy:#a9c7ee;--ink:#e6edf4;--mut:#93a3b5;--purple:#6a43b8;--lg:#1b3320;--lgb:#2f5a37;--line:#2c3b4b;--cell:#222e3a;--hd:#1f3028;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--card:#18222c;--navy:#a9c7ee;--ink:#e6edf4;--mut:#93a3b5;--purple:#6a43b8;--lg:#1b3320;--lgb:#2f5a37;--line:#2c3b4b;--cell:#222e3a;--hd:#1f3028;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,'Noto Sans Ethiopic',system-ui,sans-serif}
body.arena{--bg:#0a2332;--card:#0f2b3d;--ink:#e8f0f7;--mut:#93a9bd;--navy:#cfe3f5;--line:#1f4a66;--cell:#12304a;--lg:#123a2a;--lgb:#1f6a45;color-scheme:dark}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#111;color:#c3cbcb;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;height:58px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#111;z-index:30}
.brand{font-size:28px;cursor:pointer;display:flex;gap:8px;align-items:center;color:#c3cbcb;text-decoration:none;background:none;border:0;font-family:inherit;padding:0}
#mb{background:none;border:0;color:#fff;font-size:34px;line-height:1;cursor:pointer;width:44px;height:44px;border-radius:50%}
#mb.x{background:#e4e4e4;color:#111;font-size:26px;width:40px;height:40px}
#dr{position:fixed;left:0;top:calc(58px + env(safe-area-inset-top,0px));bottom:0;width:min(64%,300px);background:#dedede;z-index:19;transform:translateX(-105%);transition:transform .25s;overflow:auto;box-shadow:4px 0 14px #0005;color:#26323f}
#dr.open{transform:none}
.logo{background:#161616;color:#cfd3d3;padding:34px 10px 14px;text-align:center;font-size:62px;font-weight:500;line-height:1;border:2px solid #4a5d86}
.logo small{display:block;font-size:17px;letter-spacing:3px;margin-top:8px}
.who{text-align:center;font-weight:700;padding:16px 8px;border-bottom:1px solid #c7c7c7}
#dr a{display:flex;gap:10px;align-items:center;padding:16px 14px;font-size:20px;color:#1e3a5f;text-decoration:none;border-bottom:1px dotted #aaa;cursor:pointer}
#dr a.act{background:#a6aea5;color:#fff}
#dr a span{width:24px;text-align:center}
#sc{position:fixed;inset:0;background:#0004;z-index:18;display:none}
#sc.show{display:block}
main{max-width:480px;margin:0 auto;padding:12px 12px 40px}
.ban{background:var(--lg);border:1.5px solid var(--lgb);border-radius:10px;padding:14px 44px 14px 14px;position:relative;color:#1d6b24;font:600 16px/1.7 'Noto Sans Ethiopic',Roboto,sans-serif;margin-bottom:14px}
.ban button{position:absolute;right:8px;top:4px;background:none;border:0;font-size:30px;cursor:pointer;color:var(--ink)}
.cd{text-align:center;font-size:clamp(40px,14vw,60px);font-weight:700;color:var(--navy);margin:16px 0;letter-spacing:-1px}
.cdl{text-align:center;color:var(--mut);margin-top:-10px;margin-bottom:14px;font-size:15px}
.panel{background:var(--card);border-radius:28px;padding:26px 22px;box-shadow:0 3px 12px #0003;margin-bottom:14px}
.panel .ic{width:84px;height:84px;margin:0 auto 6px;display:block}
.panel h2{color:var(--navy);text-align:center;font-size:32px;margin:0;padding-bottom:12px;border-bottom:2px solid var(--line)}
.panel h3{color:var(--navy);margin:0 0 8px}
.fld{position:relative;margin-top:24px}
.fld label{position:absolute;top:-12px;left:10px;background:var(--card);padding:0 4px;color:var(--mut);font-size:19px}
.fld input,.fld select{width:100%;font:inherit;font-size:20px;padding:15px 10px;border:1.5px solid #b8c6dc;border-radius:10px;background:transparent;color:var(--ink)}
.fld select{background:var(--cell)}
.sep{border:0;border-top:2px solid var(--line);margin:22px 0 16px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;font:700 26px Roboto,sans-serif;border-radius:12px;padding:20px 10px;border:2px solid transparent;cursor:pointer;color:#fff;text-decoration:none}
.btn.p{background:var(--purple);border-color:#2a1a4d}
.btn.g{background:var(--green);border-radius:50px;margin-bottom:14px}
.btn.o{background:var(--lg);border:2px solid var(--lgb);color:var(--navy);border-radius:50px}
.btn.t{background:#00838f;border-color:#00838f}
.btn:focus-visible,.fld input:focus-visible,.fld select:focus-visible,.cell:focus-visible,.nb:focus-visible,.pill:focus-visible,.bingo:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:#c0392b;font-weight:700;margin-top:12px;min-height:20px}
.ok{color:var(--ok)}
.hv{font-size:20px;margin-top:14px}.hv a{color:#0a7a0a;font-weight:700;cursor:pointer}
.txt p,.txt li{line-height:1.6;color:var(--ink);font-size:17px}
table{width:100%;border-collapse:collapse;font-size:18px}td,th{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}
tr.nx td{background:var(--lg);font-weight:700}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{font-weight:700;font-size:18px;cursor:pointer;color:var(--navy)}
.sm{font:700 18px Roboto,sans-serif;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.sm.pp{background:var(--purple);color:#fff;border-color:var(--purple)}
#over{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px;z-index:40}#over.show{display:grid}
#over div{background:var(--card);border-radius:22px;padding:26px;text-align:center;max-width:320px}#over h2{font-size:42px;margin:0;color:var(--purple)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.btn.s{font-size:23px;padding:17px 10px;border-radius:10px;margin-top:10px}
.info{border:1.5px solid var(--line);padding:12px;margin:16px 0;text-align:center;font:500 17px/2 'Noto Sans Ethiopic',Roboto,sans-serif;color:var(--ink)}
.pay{text-align:center;font-weight:700;font-size:19px;padding:12px;border-radius:10px;background:#f6dede;color:#a12a2a;margin-bottom:6px}
.pay.ok{background:var(--lg);color:#1d6b24}
.note{font-size:14px;color:var(--mut);text-align:center;margin:6px 0 0}
#msg{text-align:center;font-weight:700;min-height:22px;margin:8px 0;color:#c0392b}
.soc{display:flex;gap:18px;justify-content:center;margin:26px 0 10px;padding-top:22px;border-top:2px solid var(--line)}
.soc b{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:30px}
.ad{text-align:center;color:var(--navy);font-size:20px;border-top:2px solid var(--line)}.ad div{height:90px;background:var(--card)}
#pm{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:24px;z-index:50}#pm.show{display:grid}
#pm>div{background:var(--card);border-radius:28px;padding:28px 26px 18px;width:100%;max-width:400px;min-height:250px;display:flex;flex-direction:column}
#pm h3{margin:0 0 22px;font-size:28px;font-weight:500}
#pm p{margin:0;white-space:pre-line;line-height:1.7;font:500 18px/1.7 'Noto Sans Ethiopic',Roboto,sans-serif;flex:1}
#pk{align-self:flex-end;background:none;border:0;color:var(--navy);font:700 20px Roboto,sans-serif;padding:12px 16px;cursor:pointer}

/* playing area (card select + game) */
.arena .cd{color:#fff}.arena .ban{color:#8ee6a0}
.arena .btn.p{background:#ff5722;border-color:#ff5722}
.arena .fld input,.arena .fld select{border-color:#2b5a7a}
.arena .pay{background:#4a1f24;color:#ffb4b4}.arena .pay.ok{background:#123a2a;color:#7ee2a8}
.arena #msg{color:#ff8a80}.arena #over h2{color:#ff5722}
.arena h4{margin:20px 0 10px;font-size:20px;color:#fff}
.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.nb{min-height:38px;border:1px solid #1f5476;background:#0f2f45;color:#cfe3f5;border-radius:8px;font:500 14px Roboto,sans-serif;cursor:pointer;padding:0}
.nb[aria-pressed=true]{background:#ff5722;border-color:#ff8a65;color:#fff;font-weight:700}
.pcard{background:#1b3b4d;border-radius:22px;padding:16px}
.gcard{background:#5c2b2b;border-radius:22px;padding:14px 12px 16px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.hdr{text-align:center;font:700 28px/1.5 Roboto,sans-serif}
.hdr:nth-child(1){color:#ff5252}.hdr:nth-child(2){color:#4c8dff}.hdr:nth-child(3){color:#5be0a0}.hdr:nth-child(4){color:#ffd54f}.hdr:nth-child(5){color:#d946ef}
.cell{aspect-ratio:1;border:0;border-radius:10px;background:#3b1d1e;color:#fff;font:700 clamp(20px,6.5vw,28px) Roboto,sans-serif;cursor:pointer;padding:0;display:grid;place-items:center}
div.cell{cursor:default}
.cell.on{background:#25d366;color:#062b14}
.cell.free{background:#25d366;color:#fff;cursor:default}
.cell.win{background:#ffb300;color:#1a1000}
.cell.sh{animation:sh .3s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pr{display:flex;gap:14px;margin-top:22px}
.pill{flex:1;border:0;border-radius:50px;padding:20px 8px;font:700 18px Roboto,sans-serif;color:#fff;cursor:pointer}
.pill.t{background:#00838f}.pill.o{background:#ff5722}
.goal{display:flex;justify-content:space-between;gap:10px;background:#123a52;border:1px solid #1f5476;border-radius:10px;padding:12px 16px;color:#fff;font:500 18px Roboto,sans-serif}
.goal b{color:#f5b82e;text-align:right}
.board{background:#06141d;border-radius:14px;padding:12px;margin-top:12px}
.bgr{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.bn{aspect-ratio:1;display:grid;place-items:center;border-radius:5px;background:#12304a;color:#7f95ab;font:500 clamp(11px,3.4vw,15px) Roboto,sans-serif}
.bn.c{background:#ff5722;color:#fff;font-weight:700}.bn.l{outline:2px solid #fff;outline-offset:1px}
.last{text-align:center;color:#93a9bd;margin:10px 0 0;font-size:15px}
.bingo{width:100%;border:0;border-radius:50px;background:#ff5722;color:#fff;font:700 20px Roboto,sans-serif;padding:18px;margin:16px 0 6px;cursor:pointer}
.wal{background:#123a52;border:1px solid #1f5476;border-radius:16px;padding:16px;text-align:center;margin-top:16px}.wal small{display:block;color:#93a9bd}.wal b{display:block;font-size:34px;color:#f5b82e;margin:4px 0}
.txl{list-style:none;margin:10px 0 0;padding:0}.txl li{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #1f4a66;font-size:16px}.cr{color:#7ee2a8}.db{color:#ff8a80}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;padding:12px 6px;border-radius:10px;border:1px solid #1f5476;background:#0f2f45;color:#cfe3f5;font:700 15px Roboto,sans-serif;cursor:pointer}.tabs button[aria-pressed=true]{background:#ff5722;border-color:#ff5722;color:#fff}
.ac{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;font-size:16px;line-height:1.5}.ac b{color:#fff}.ac small{color:var(--mut);display:block;word-break:break-all}.ac a{color:#8ec5ff}
.ar{display:flex;gap:8px;margin-top:10px}.ar input{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px;border:1.5px solid #2b5a7a;border-radius:10px;background:transparent;color:var(--ink)}
.ab{border:0;border-radius:10px;padding:10px 14px;font:700 16px Roboto,sans-serif;color:#fff;cursor:pointer;background:#00838f}.ab.ok{background:#1f9d6b}.ab.no{background:#c0392b}
.pe{color:#f5b82e}.uc[hidden]{display:none}
.sq{width:100%;font:inherit;font-size:18px;padding:12px;border:1.5px solid #2b5a7a;border-radius:10px;background:transparent;color:var(--ink);margin-bottom:12px}
.sumry{text-align:center;color:#f6d77a;font-weight:700;margin:12px 0 0;min-height:22px}.nb.cur{box-shadow:0 0 0 2px #fff}
#cg .gcard{animation:none}.ctitle{text-align:center;color:#f6d77a;font:600 18px 'Playfair Display','Noto Sans Ethiopic',Georgia,serif;margin:0 0 4px}
.toast{position:fixed;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top,0px));z-index:70;max-width:456px;margin:0 auto;background:linear-gradient(135deg,#f6d77a,#d99a1e);color:#2a0f55;font:700 18px Roboto,sans-serif;border-radius:14px;padding:14px 16px;text-align:center;box-shadow:0 10px 30px #000a;animation:rise .4s both}
.hr{display:flex;align-items:center;gap:8px}#lgb{background:none;border:1px solid #f0c75e88;color:#f6d77a;border-radius:20px;padding:7px 11px;font:700 14px Roboto,'Noto Sans Ethiopic',sans-serif;cursor:pointer}.brand{font-size:25px}
.lang{display:flex;gap:6px;padding:10px}.lang button{flex:1;padding:10px 2px;border-radius:8px;border:1px solid #f0c75e66;background:#25124a;color:#e9dcff;font:600 14px Roboto,'Noto Sans Ethiopic',sans-serif;cursor:pointer}.lang button[aria-pressed=true]{background:linear-gradient(135deg,#f6d77a,#d99a1e);color:#2a0f55}
.opt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:16px}
.opt button{background:none;border:1px solid #2b5a7a;color:#cfe3f5;border-radius:10px;padding:10px 16px;font:500 16px Roboto,sans-serif;cursor:pointer}

/* ===== Royal purple luxury theme ===== */
body,body.arena{--bg:#14072a;--card:#1e0f3b;--navy:#e9dcff;--ink:#f1eafc;--mut:#b9a6d9;--purple:#7b2ff7;--lg:#2a1650;--lgb:#5a37a0;--line:#3b2468;--cell:#2a1650;--hd:#2a1650;--gold:#f0c75e;color-scheme:dark;
background:radial-gradient(900px 520px at 50% -8%,#5b21b655,transparent 70%),linear-gradient(180deg,#14072a,#0a0316) fixed;background-color:#0a0316}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(420px 420px at 20% 30%,#7b2ff733,transparent 70%),radial-gradient(380px 380px at 80% 70%,#f0c75e1f,transparent 70%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,-5%) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes flow{to{background-position:200% 0}}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes ping{0%{transform:scale(1)}40%{transform:scale(1.28);box-shadow:0 0 14px #f6d77a}100%{transform:scale(1)}}
@keyframes glow{50%{box-shadow:0 0 26px #f0c75e99,0 6px 18px #0008}}
@keyframes fall{from{top:-12px;opacity:1}to{top:105%;opacity:.9}}
@keyframes pop{from{opacity:0;transform:scale(.88)}}
#view>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#view>*:nth-child(2){animation-delay:.06s}#view>*:nth-child(3){animation-delay:.12s}#view>*:nth-child(4){animation-delay:.18s}#view>*:nth-child(5){animation-delay:.24s}#view>*:nth-child(6){animation-delay:.3s}#view>*:nth-child(n+7){animation-delay:.36s}
#view.na>*{animation:none}
.top{background:linear-gradient(90deg,#2a0f55,#6d28d9,#2a0f55);background-size:200% 100%;animation:flow 12s linear infinite;color:#f6e7b4;border-bottom:1px solid #f0c75e66;box-shadow:0 4px 20px #0007}
body::before{background:#2a0f55}
.brand{color:#f6d77a;font-family:'Playfair Display','Noto Sans Ethiopic',Georgia,serif;font-weight:700;letter-spacing:.5px;text-shadow:0 0 14px #f0c75e66}
#mb{color:#f6d77a;border:1px solid #f0c75e55;transition:transform .2s}#mb:active{transform:scale(.9)}#mb.x{background:#f6d77a;color:#2a0f55}
#dr{background:linear-gradient(180deg,#2a0f55,#14072a);color:#f1eafc;box-shadow:6px 0 24px #000a}
.logo{background:linear-gradient(160deg,#4b1d8f,#1a0b33);color:#f6d77a;font-family:'Playfair Display','Noto Sans Ethiopic',Georgia,serif;border:0;border-bottom:1px solid #f0c75e66}
.who{color:#e9dcff;border-bottom:1px solid #f0c75e33}
#dr a{color:#e9dcff;border-bottom:1px solid #ffffff14;transition:background .2s,padding .2s}#dr a:hover{background:#ffffff12;padding-left:20px}
#dr a.act{background:linear-gradient(90deg,#f6d77a,#d99a1e);color:#2a0f55;font-weight:700}
.ban{background:linear-gradient(135deg,#3b1d73,#2a1650);border-color:#f0c75e66;color:#f6e7b4}
.cd{font-family:'Playfair Display','Noto Sans Ethiopic',Georgia,serif;background:linear-gradient(90deg,#f6e7b4,#f0c75e,#fff3c9,#f0c75e,#f6e7b4);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 5s linear infinite;filter:drop-shadow(0 0 12px #f0c75e44)}
.arena .cd{color:transparent}
.panel{background:linear-gradient(160deg,#2a1650,#1a0b33);border:1px solid #f0c75e33;box-shadow:0 14px 34px #000a,inset 0 1px 0 #ffffff14}
.panel .ic{fill:#f0c75e}
.panel h2{font-family:'Playfair Display','Noto Sans Ethiopic',Georgia,serif;color:#f6d77a;border-bottom:1px solid #f0c75e44}
.fld input,.fld select,.arena .fld input,.arena .fld select{border-color:#5a37a0;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus{border-color:#f0c75e;box-shadow:0 0 0 3px #f0c75e44;outline:0}
.btn,.pill,.bingo,.ab,.nb,.tabs button{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,filter .2s}
.btn:active,.pill:active,.bingo:active,.ab:active,.nb:active{transform:scale(.97)}
.btn:hover,.pill:hover,.bingo:hover{filter:brightness(1.1)}
.btn.p,.arena .btn.p{background:linear-gradient(135deg,#9333ea,#5b21b6);border:1px solid #f0c75e88;box-shadow:0 6px 18px #5b21b688}
.btn.g{background:linear-gradient(135deg,#f6d77a,#d99a1e);color:#2a0f55;border:0;box-shadow:0 6px 18px #d99a1e55}
.btn.o{background:transparent;border:1.5px solid #f0c75e;color:#f6d77a}
.btn.t{background:linear-gradient(135deg,#6d28d9,#4c1d95);border-color:#f0c75e55}
.btn.p::after,.btn.g::after,.pill.o::after,.bingo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.6s infinite;pointer-events:none}
.hv a{color:#f6d77a}.err{color:#ff8a9a}
.info{border-color:#f0c75e55;background:#ffffff08}
.pay{background:#4a1f3a;color:#ffb4c8}.pay.ok,.arena .pay.ok{background:#123a2e;color:#7ee2a8}.arena .pay{background:#4a1f3a;color:#ffb4c8}
.wal{background:linear-gradient(135deg,#4b1d8f,#2a0f55);border:1px solid #f0c75e77;box-shadow:0 8px 24px #0008,0 0 24px #7b2ff733}
.wal b{font-family:'Playfair Display','Noto Sans Ethiopic',Georgia,serif;color:#f6d77a;font-size:38px}
.txl li{border-bottom-color:#3b2468}.pe{color:#f6d77a}
#pm>div,#over div{background:linear-gradient(160deg,#2a1650,#1a0b33);border:1px solid #f0c75e66;box-shadow:0 20px 50px #000c}
#pm.show>div,#over.show div{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
#pk{color:#f6d77a}.arena #over h2,#over h2{font-family:'Playfair Display','Noto Sans Ethiopic',Georgia,serif;color:#f6d77a;text-shadow:0 0 22px #f0c75e88}

["Tap one or more card numbers (1–30). Each cartela costs 30 birr, and the last card you tapped shows in the preview. Then press Start Game. Columns are B (1–15), I (16–30), N (31–45), G (46–60) and O (61–75). The center is free.","አንድ ወይም ከዚያ በላይ የካርድ ቁጥሮችን (1–30) ይንኩ። እያንዳንዱ ካርቴላ 30 ብር ነው፣ መጨረሻ የነኩት ካርድ በቅድመ እይታው ይታያል። ከዚያ ጨዋታ ጀምር ይጫኑ። ዓምዶቹ B (1–15)፣ I (16–30)፣ N (31–45)፣ G (46–60) እና O (61–75) ናቸው። መሃሉ ነጻ ነው።","ሓደ ወይ ልዕሊኡ ቁጽሪ ካርድ (1–30) ጠውቑ። ነፍሲ ወከፍ ካርቴላ 30 ብር እዩ፣ መወዳእታ ዝጠወቕኩሞ ካርድ ኣብ ቅድሚ ርእይቶ ይርአ። ድሕሪኡ ጸወታ ጀምር ጠውቑ። ዓምዲታት B (1–15)፣ I (16–30)፣ N (31–45)፣ G (46–60) ከምኡውን O (61–75) እዮም። እቲ ማእከል ነጻ እዩ።"],
["The game starts automatically for everyone when the countdown ends. All players get the same numbers, which light up on the board; the first player to complete the goal and press Bingo wins and the game ends for all. The Target Goal shows the pattern you need.","ቆጠራው ሲያበቃ ጨዋታው ለሁሉም ሰው በራስ-ሰር ይጀምራል። ሁሉም ተጫዋቾች አንድ አይነት ቁጥሮች ያገኛሉ፣ እነዚህም በሰሌዳው ላይ ይበራሉ፤ ግቡን ሞልቶ ቢንጎ የሚጫን የመጀመሪያው ተጫዋች ያሸንፋል፣ ጨዋታውም ለሁሉም ያበቃል። የዒላማ ግቡ የሚያስፈልገዎትን ንድፍ ያሳያል።","እቲ ቆጸራ ምስ ተወዲአ ጸወታ ንኹሉ ብባዕሉ ይጅምር። ኩሎም ተጻዋትቲ ሓደ ዓይነት ቁጽርታት ይረኽቡ፣ ንሳቶም ኣብቲ ሰሌዳ የብርሁ፤ ዕላማ ዘማልአ ቢንጎ ዝጠወቐ ቀዳማይ ተጻዋታይ ይስዕር፣ እቲ ጸወታ ድማ ንኹሉ ይውዳእ። እቲ ዕላማ እቲ ዘድልየካ ኣሰራርዓ የርእይ።"],
["Tap a called number on your card to mark it, or turn on Auto-mark.","በካርድዎ ላይ የተጠራውን ቁጥር ለማመልከት ይንኩት፣ ወይም ራስ-ሰር ምልክትን ያብሩ።","ኣብ ካርድኩም ዝተጸውዐ ቁጽሪ ንምልክት ጠውቑዎ፣ ወይ ባዕሉ ምልክት ምግባር ኣብርሁ።"],["Complete the Target Goal and press Bingo!","የዒላማ ግቡን ይሙሉ እና ቢንጎ! ይጫኑ።","ዕላማ ኣማልኡ ከምኡውን ቢንጎ! ጠውቑ።"],
["YEME BINGO is a bingo game with scheduled game times. Pick your cartelas, join your game and play with other players. The first player to complete the goal wins.","YEME ቢንጎ በጊዜ ሰሌዳ የሚካሄድ የቢንጎ ጨዋታ ነው። ካርቴላዎችዎን ይምረጡ፣ ጨዋታዎን ይቀላቀሉ እና ከሌሎች ተጫዋቾች ጋር ይጫወቱ። ግቡን ሞልቶ የሚጨርስ የመጀመሪያው ተጫዋች ያሸንፋል።","YEME ቢንጎ ብሰሌዳ ዝካየድ ናይ ቢንጎ ጸወታ እዩ። ካርቴላታትኩም ሕረዩ፣ ኣብ ጸወታኹም ተሳተፉ ከምኡውን ምስ ካልኦት ተጻዋትቲ ተጻወቱ። ዕላማ ዘማልአ ቀዳማይ ተጻዋታይ ይስዕር።"],
["Contact details will be added soon.","የመገናኛ መረጃ በቅርቡ ይታከላል።","ናይ ርክብ ሓበሬታ ኣብ ቀረባ ግዜ ክውሰኽ እዩ።"],
