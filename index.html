<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YEME BINGO</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@600&family=Roboto:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#f4f8fb;--card:#fff;--navy:#1e3a5f;--ink:#26323f;--mut:#5d6b7a;--purple:#351c63;--green:#36a420;--lg:#dcedde;--lgb:#a9d3a4;--line:#c9d6e6;--cell:#ececee;--hd:#d5e0d3;--gold:#f5b82e;--ok:#1f9d6b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18222c;--navy:#a9c7ee;--ink:#e6edf4;--mut:#93a3b5;--purple:#6a43b8;--lg:#1b3320;--lgb:#2f5a37;--line:#2c3b4b;--cell:#222e3a;--hd:#1f3028;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--card:#18222c;--navy:#a9c7ee;--ink:#e6edf4;--mut:#93a3b5;--purple:#6a43b8;--lg:#1b3320;--lgb:#2f5a37;--line:#2c3b4b;--cell:#222e3a;--hd:#1f3028;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,sans-serif}
body.arena{--bg:#0a2332;--card:#0f2b3d;--ink:#e8f0f7;--mut:#93a9bd;--navy:#cfe3f5;--line:#1f4a66;--cell:#12304a;--lg:#123a2a;--lgb:#1f6a45;color-scheme:dark}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#111;color:#c3cbcb;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;height:58px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#111;z-index:30}
.brand{font-size:28px;cursor:pointer;display:flex;gap:8px;align-items:center;color:#c3cbcb;text-decoration:none;background:none;border:0;font-family:inherit;padding:0}
#mb{background:none;border:0;color:#fff;font-size:34px;line-height:1;cursor:pointer;width:44px;height:44px;border-radius:50%}
#mb.x{background:#e4e4e4;color:#111;font-size:26px;width:40px;height:40px}
#dr{position:fixed;left:0;top:calc(58px + env(safe-area-inset-top,0px));bottom:0;width:min(64%,300px);background:#dedede;z-index:19;transform:translateX(-105%);transition:transform .25s;overflow:auto;box-shadow:4px 0 14px #0005;color:#26323f}
#dr.open{transform:none}
.logo{background:#161616;color:#cfd3d3;padding:34px 10px 14px;text-align:center;font-size:62px;font-weight:500;line-height:1;border:2px solid #4a5d86}
.logo small{display:block;font-size:17px;letter-spacing:3px;margin-top:8px}
.who{text-align:center;font-weight:700;padding:16px 8px;border-bottom:1px solid #c7c7c7}
#dr a{display:flex;gap:10px;align-items:center;padding:16px 14px;font-size:20px;color:#1e3a5f;text-decoration:none;border-bottom:1px dotted #aaa;cursor:pointer}
#dr a.act{background:#a6aea5;color:#fff}
#dr a span{width:24px;text-align:center}
#sc{position:fixed;inset:0;background:#0004;z-index:18;display:none}
#sc.show{display:block}
main{max-width:480px;margin:0 auto;padding:12px 12px 40px}
.ban{background:var(--lg);border:1.5px solid var(--lgb);border-radius:10px;padding:14px 44px 14px 14px;position:relative;color:#1d6b24;font:600 16px/1.7 'Noto Sans Ethiopic',Roboto,sans-serif;margin-bottom:14px}
.ban button{position:absolute;right:8px;top:4px;background:none;border:0;font-size:30px;cursor:pointer;color:var(--ink)}
.cd{text-align:center;font-size:clamp(40px,14vw,60px);font-weight:700;color:var(--navy);margin:16px 0;letter-spacing:-1px}
.cdl{text-align:center;color:var(--mut);margin-top:-10px;margin-bottom:14px;font-size:15px}
.panel{background:var(--card);border-radius:28px;padding:26px 22px;box-shadow:0 3px 12px #0003;margin-bottom:14px}
.panel .ic{width:84px;height:84px;margin:0 auto 6px;display:block}
.panel h2{color:var(--navy);text-align:center;font-size:32px;margin:0;padding-bottom:12px;border-bottom:2px solid var(--line)}
.panel h3{color:var(--navy);margin:0 0 8px}
.fld{position:relative;margin-top:24px}
.fld label{position:absolute;top:-12px;left:10px;background:var(--card);padding:0 4px;color:var(--mut);font-size:19px}
.fld input,.fld select{width:100%;font:inherit;font-size:20px;padding:15px 10px;border:1.5px solid #b8c6dc;border-radius:10px;background:transparent;color:var(--ink)}
.fld select{background:var(--cell)}
.sep{border:0;border-top:2px solid var(--line);margin:22px 0 16px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;font:700 26px Roboto,sans-serif;border-radius:12px;padding:20px 10px;border:2px solid transparent;cursor:pointer;color:#fff;text-decoration:none}
.btn.p{background:var(--purple);border-color:#2a1a4d}
.btn.g{background:var(--green);border-radius:50px;margin-bottom:14px}
.btn.o{background:var(--lg);border:2px solid var(--lgb);color:var(--navy);border-radius:50px}
.btn.t{background:#00838f;border-color:#00838f}
.btn:focus-visible,.fld input:focus-visible,.fld select:focus-visible,.cell:focus-visible,.nb:focus-visible,.pill:focus-visible,.bingo:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:#c0392b;font-weight:700;margin-top:12px;min-height:20px}
.ok{color:var(--ok)}
.hv{font-size:20px;margin-top:14px}.hv a{color:#0a7a0a;font-weight:700;cursor:pointer}
.txt p,.txt li{line-height:1.6;color:var(--ink);font-size:17px}
table{width:100%;border-collapse:collapse;font-size:18px}td,th{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}
tr.nx td{background:var(--lg);font-weight:700}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{font-weight:700;font-size:18px;cursor:pointer;color:var(--navy)}
.sm{font:700 18px Roboto,sans-serif;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.sm.pp{background:var(--purple);color:#fff;border-color:var(--purple)}
#over{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px;z-index:40}#over.show{display:grid}
#over div{background:var(--card);border-radius:22px;padding:26px;text-align:center;max-width:320px}#over h2{font-size:42px;margin:0;color:var(--purple)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.btn.s{font-size:23px;padding:17px 10px;border-radius:10px;margin-top:10px}
.info{border:1.5px solid var(--line);padding:12px;margin:16px 0;text-align:center;font:500 17px/2 'Noto Sans Ethiopic',Roboto,sans-serif;color:var(--ink)}
.pay{text-align:center;font-weight:700;font-size:19px;padding:12px;border-radius:10px;background:#f6dede;color:#a12a2a;margin-bottom:6px}
.pay.ok{background:var(--lg);color:#1d6b24}
.note{font-size:14px;color:var(--mut);text-align:center;margin:6px 0 0}
#msg{text-align:center;font-weight:700;min-height:22px;margin:8px 0;color:#c0392b}
.soc{display:flex;gap:18px;justify-content:center;margin:26px 0 10px;padding-top:22px;border-top:2px solid var(--line)}
.soc b{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:30px}
.ad{text-align:center;color:var(--navy);font-size:20px;border-top:2px solid var(--line)}.ad div{height:90px;background:var(--card)}
#pm{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:24px;z-index:50}#pm.show{display:grid}
#pm>div{background:var(--card);border-radius:28px;padding:28px 26px 18px;width:100%;max-width:400px;min-height:250px;display:flex;flex-direction:column}
#pm h3{margin:0 0 22px;font-size:28px;font-weight:500}
#pm p{margin:0;white-space:pre-line;line-height:1.7;font:500 18px/1.7 'Noto Sans Ethiopic',Roboto,sans-serif;flex:1}
#pk{align-self:flex-end;background:none;border:0;color:var(--navy);font:700 20px Roboto,sans-serif;padding:12px 16px;cursor:pointer}

/* playing area (card select + game) */
.arena .cd{color:#fff}.arena .ban{color:#8ee6a0}
.arena .btn.p{background:#ff5722;border-color:#ff5722}
.arena .fld input,.arena .fld select{border-color:#2b5a7a}
.arena .pay{background:#4a1f24;color:#ffb4b4}.arena .pay.ok{background:#123a2a;color:#7ee2a8}
.arena #msg{color:#ff8a80}.arena #over h2{color:#ff5722}
.arena h4{margin:20px 0 10px;font-size:20px;color:#fff}
.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.nb{min-height:38px;border:1px solid #1f5476;background:#0f2f45;color:#cfe3f5;border-radius:8px;font:500 14px Roboto,sans-serif;cursor:pointer;padding:0}
.nb[aria-pressed=true]{background:#ff5722;border-color:#ff8a65;color:#fff;font-weight:700}
.pcard{background:#1b3b4d;border-radius:22px;padding:16px}
.gcard{background:#5c2b2b;border-radius:22px;padding:14px 12px 16px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.hdr{text-align:center;font:700 28px/1.5 Roboto,sans-serif}
.hdr:nth-child(1){color:#ff5252}.hdr:nth-child(2){color:#4c8dff}.hdr:nth-child(3){color:#5be0a0}.hdr:nth-child(4){color:#ffd54f}.hdr:nth-child(5){color:#d946ef}
.cell{aspect-ratio:1;border:0;border-radius:10px;background:#3b1d1e;color:#fff;font:700 clamp(20px,6.5vw,28px) Roboto,sans-serif;cursor:pointer;padding:0;display:grid;place-items:center}
div.cell{cursor:default}
.cell.on{background:#25d366;color:#062b14}
.cell.free{background:#25d366;color:#fff;cursor:default}
.cell.win{background:#ffb300;color:#1a1000}
.cell.sh{animation:sh .3s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pr{display:flex;gap:14px;margin-top:22px}
.pill{flex:1;border:0;border-radius:50px;padding:20px 8px;font:700 18px Roboto,sans-serif;color:#fff;cursor:pointer}
.pill.t{background:#00838f}.pill.o{background:#ff5722}
.goal{display:flex;justify-content:space-between;gap:10px;background:#123a52;border:1px solid #1f5476;border-radius:10px;padding:12px 16px;color:#fff;font:500 18px Roboto,sans-serif}
.goal b{color:#f5b82e;text-align:right}
.board{background:#06141d;border-radius:14px;padding:12px;margin-top:12px}
.bgr{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.bn{aspect-ratio:1;display:grid;place-items:center;border-radius:5px;background:#12304a;color:#7f95ab;font:500 clamp(11px,3.4vw,15px) Roboto,sans-serif}
.bn.c{background:#ff5722;color:#fff;font-weight:700}.bn.l{outline:2px solid #fff;outline-offset:1px}
.last{text-align:center;color:#93a9bd;margin:10px 0 0;font-size:15px}
.bingo{width:100%;border:0;border-radius:50px;background:#ff5722;color:#fff;font:700 20px Roboto,sans-serif;padding:18px;margin:16px 0 6px;cursor:pointer}
.wal{background:#123a52;border:1px solid #1f5476;border-radius:16px;padding:16px;text-align:center;margin-top:16px}.wal small{display:block;color:#93a9bd}.wal b{display:block;font-size:34px;color:#f5b82e;margin:4px 0}
.txl{list-style:none;margin:10px 0 0;padding:0}.txl li{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #1f4a66;font-size:16px}.cr{color:#7ee2a8}.db{color:#ff8a80}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;padding:12px 6px;border-radius:10px;border:1px solid #1f5476;background:#0f2f45;color:#cfe3f5;font:700 15px Roboto,sans-serif;cursor:pointer}.tabs button[aria-pressed=true]{background:#ff5722;border-color:#ff5722;color:#fff}
.ac{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;font-size:16px;line-height:1.5}.ac b{color:#fff}.ac small{color:var(--mut);display:block;word-break:break-all}.ac a{color:#8ec5ff}
.ar{display:flex;gap:8px;margin-top:10px}.ar input{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px;border:1.5px solid #2b5a7a;border-radius:10px;background:transparent;color:var(--ink)}
.ab{border:0;border-radius:10px;padding:10px 14px;font:700 16px Roboto,sans-serif;color:#fff;cursor:pointer;background:#00838f}.ab.ok{background:#1f9d6b}.ab.no{background:#c0392b}
.pe{color:#f5b82e}.uc[hidden]{display:none}
.sq{width:100%;font:inherit;font-size:18px;padding:12px;border:1.5px solid #2b5a7a;border-radius:10px;background:transparent;color:var(--ink);margin-bottom:12px}
.sumry{text-align:center;color:#f6d77a;font-weight:700;margin:12px 0 0;min-height:22px}.nb.cur{box-shadow:0 0 0 2px #fff}
#cg .gcard{animation:none}.ctitle{text-align:center;color:#f6d77a;font:600 18px 'Playfair Display',Georgia,serif;margin:0 0 4px}
.toast{position:fixed;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top,0px));z-index:70;max-width:456px;margin:0 auto;background:linear-gradient(135deg,#f6d77a,#d99a1e);color:#2a0f55;font:700 18px Roboto,sans-serif;border-radius:14px;padding:14px 16px;text-align:center;box-shadow:0 10px 30px #000a;animation:rise .4s both}
.opt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:16px}
.opt button{background:none;border:1px solid #2b5a7a;color:#cfe3f5;border-radius:10px;padding:10px 16px;font:500 16px Roboto,sans-serif;cursor:pointer}

/* ===== Royal purple luxury theme ===== */
body,body.arena{--bg:#14072a;--card:#1e0f3b;--navy:#e9dcff;--ink:#f1eafc;--mut:#b9a6d9;--purple:#7b2ff7;--lg:#2a1650;--lgb:#5a37a0;--line:#3b2468;--cell:#2a1650;--hd:#2a1650;--gold:#f0c75e;color-scheme:dark;
background:radial-gradient(900px 520px at 50% -8%,#5b21b655,transparent 70%),linear-gradient(180deg,#14072a,#0a0316) fixed;background-color:#0a0316}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(420px 420px at 20% 30%,#7b2ff733,transparent 70%),radial-gradient(380px 380px at 80% 70%,#f0c75e1f,transparent 70%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,-5%) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes flow{to{background-position:200% 0}}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes ping{0%{transform:scale(1)}40%{transform:scale(1.28);box-shadow:0 0 14px #f6d77a}100%{transform:scale(1)}}
@keyframes glow{50%{box-shadow:0 0 26px #f0c75e99,0 6px 18px #0008}}
@keyframes fall{from{top:-12px;opacity:1}to{top:105%;opacity:.9}}
@keyframes pop{from{opacity:0;transform:scale(.88)}}
#view>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#view>*:nth-child(2){animation-delay:.06s}#view>*:nth-child(3){animation-delay:.12s}#view>*:nth-child(4){animation-delay:.18s}#view>*:nth-child(5){animation-delay:.24s}#view>*:nth-child(6){animation-delay:.3s}#view>*:nth-child(n+7){animation-delay:.36s}
#view.na>*{animation:none}
.top{background:linear-gradient(90deg,#2a0f55,#6d28d9,#2a0f55);background-size:200% 100%;animation:flow 12s linear infinite;color:#f6e7b4;border-bottom:1px solid #f0c75e66;box-shadow:0 4px 20px #0007}
body::before{background:#2a0f55}
.brand{color:#f6d77a;font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:.5px;text-shadow:0 0 14px #f0c75e66}
#mb{color:#f6d77a;border:1px solid #f0c75e55;transition:transform .2s}#mb:active{transform:scale(.9)}#mb.x{background:#f6d77a;color:#2a0f55}
#dr{background:linear-gradient(180deg,#2a0f55,#14072a);color:#f1eafc;box-shadow:6px 0 24px #000a}
.logo{background:linear-gradient(160deg,#4b1d8f,#1a0b33);color:#f6d77a;font-family:'Playfair Display',Georgia,serif;border:0;border-bottom:1px solid #f0c75e66}
.who{color:#e9dcff;border-bottom:1px solid #f0c75e33}
#dr a{color:#e9dcff;border-bottom:1px solid #ffffff14;transition:background .2s,padding .2s}#dr a:hover{background:#ffffff12;padding-left:20px}
#dr a.act{background:linear-gradient(90deg,#f6d77a,#d99a1e);color:#2a0f55;font-weight:700}
.ban{background:linear-gradient(135deg,#3b1d73,#2a1650);border-color:#f0c75e66;color:#f6e7b4}
.cd{font-family:'Playfair Display',Georgia,serif;background:linear-gradient(90deg,#f6e7b4,#f0c75e,#fff3c9,#f0c75e,#f6e7b4);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 5s linear infinite;filter:drop-shadow(0 0 12px #f0c75e44)}
.arena .cd{color:transparent}
.panel{background:linear-gradient(160deg,#2a1650,#1a0b33);border:1px solid #f0c75e33;box-shadow:0 14px 34px #000a,inset 0 1px 0 #ffffff14}
.panel .ic{fill:#f0c75e}
.panel h2{font-family:'Playfair Display',Georgia,serif;color:#f6d77a;border-bottom:1px solid #f0c75e44}
.fld input,.fld select,.arena .fld input,.arena .fld select{border-color:#5a37a0;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus{border-color:#f0c75e;box-shadow:0 0 0 3px #f0c75e44;outline:0}
.btn,.pill,.bingo,.ab,.nb,.tabs button{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,filter .2s}
.btn:active,.pill:active,.bingo:active,.ab:active,.nb:active{transform:scale(.97)}
.btn:hover,.pill:hover,.bingo:hover{filter:brightness(1.1)}
.btn.p,.arena .btn.p{background:linear-gradient(135deg,#9333ea,#5b21b6);border:1px solid #f0c75e88;box-shadow:0 6px 18px #5b21b688}
.btn.g{background:linear-gradient(135deg,#f6d77a,#d99a1e);color:#2a0f55;border:0;box-shadow:0 6px 18px #d99a1e55}
.btn.o{background:transparent;border:1.5px solid #f0c75e;color:#f6d77a}
.btn.t{background:linear-gradient(135deg,#6d28d9,#4c1d95);border-color:#f0c75e55}
.btn.p::after,.btn.g::after,.pill.o::after,.bingo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.6s infinite;pointer-events:none}
.hv a{color:#f6d77a}.err{color:#ff8a9a}
.info{border-color:#f0c75e55;background:#ffffff08}
.pay{background:#4a1f3a;color:#ffb4c8}.pay.ok,.arena .pay.ok{background:#123a2e;color:#7ee2a8}.arena .pay{background:#4a1f3a;color:#ffb4c8}
.wal{background:linear-gradient(135deg,#4b1d8f,#2a0f55);border:1px solid #f0c75e77;box-shadow:0 8px 24px #0008,0 0 24px #7b2ff733}
.wal b{font-family:'Playfair Display',Georgia,serif;color:#f6d77a;font-size:38px}
.txl li{border-bottom-color:#3b2468}.pe{color:#f6d77a}
#pm>div,#over div{background:linear-gradient(160deg,#2a1650,#1a0b33);border:1px solid #f0c75e66;box-shadow:0 20px 50px #000c}
#pm.show>div,#over.show div{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
#pk{color:#f6d77a}.arena #over h2,#over h2{font-family:'Playfair Display',Georgia,serif;color:#f6d77a;text-shadow:0 0 22px #f0c75e88}
.sm.pp{background:linear-gradient(135deg,#9333ea,#5b21b6);border-color:#f0c75e88}
.arena h4{font-family:'Playfair Display',Georgia,serif;color:#f6d77a;font-weight:600}
.nb{background:#25124a;border-color:#5a37a0;color:#e9dcff}
.nb:hover{border-color:#f0c75e}
.nb[aria-pressed=true]{background:linear-gradient(135deg,#f6d77a,#d99a1e);border-color:#fff3c9;color:#2a0f55;box-shadow:0 0 12px #f0c75e88}
.pcard{background:#25124a;border:1px solid #f0c75e33;box-shadow:0 10px 26px #0008;animation:rise .5s both}
.gcard{background:linear-gradient(160deg,#4b1d8f,#2a0f55);border:1px solid #f0c75e66;box-shadow:0 14px 34px #000a,0 0 30px #7b2ff744;animation:rise .6s both}
.hdr:nth-child(n){font-family:'Playfair Display',Georgia,serif;color:#f6d77a;text-shadow:0 0 12px #f0c75e66}
.cell{background:#25124a;color:#fff;box-shadow:inset 0 1px 0 #ffffff1a;transition:transform .12s}

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var VERIFY_URL='', /* paste your Cloudflare Worker URL here, e.g. https://YEME-bingo-verify.yourname.workers.dev */ PAY_BIRR=30,PAY_NAME='YEMANE',PAY_NUM='0939383425';
/* Payment rule: 1 cartela per full 30 birr (30=1, 60=2, 90=3 ...). Below 30 birr is never confirmed. */
function cartelas(amount){amount=Number(amount);if(!isFinite(amount)||amount<PAY_BIRR)return 0;return Math.floor(amount/PAY_BIRR)}
function pays(){return DB?C.pay:lg('sb_pay',mem.pay)}
function sp(l){mem.pay=l;ls('sb_pay',l)}
function adm(){return DB?C.admin:lg('sb_admin',mem.admin)}
function isAdm(){return lg('sb_as',mem.as)===true}
var AT='pay';
function when(t){var d=new Date(t);return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
var STX={pending:['Pending approval','pe'],approved:['Approved','cr'],declined:['Declined','db']};
function reqHTML(u){var l=pays().filter(function(x){return x.u===u}).slice(-5).reverse();if(!l.length)return '';
  return '<h4>Payment requests</h4><ul class="txl">'+l.map(function(x){return '<li><span>'+x.amt+' birr · '+esc(x.rid)+'</span><b class="'+STX[x.st][1]+'">'+STX[x.st][0]+'</b></li>'}).join('')+'</ul>'}
function adminPanel(){var ps=pays(),us=users(),pend=ps.filter(function(x){return x.st==='pending'}),tot=0;
  ps.forEach(function(x){if(x.st==='approved')tot+=x.amt});
  var h='<div id="adm"><div class="tabs"><button data-t="pay" aria-pressed="'+(AT==='pay')+'">Payments'+(pend.length?' ('+pend.length+')':'')+'</button><button data-t="users" aria-pressed="'+(AT==='users')+'">Users ('+Object.keys(us).length+')</button><button data-t="out" aria-pressed="false">Logout</button></div><div id="amsg" class="err" role="status"></div>';
  if(AT==='pay'){
    h+='<h4>Pending ('+pend.length+') · Approved total '+tot+' birr</h4>';
    if(!pend.length)h+='<p class="note">No pending payments.</p>';
    pend.forEach(function(x){var ph=(us[x.u]||{}).phone||'–';
      h+='<div class="ac"><b>'+esc(x.u)+'</b> · '+esc(ph)+'<small>'+when(x.ts)+'</small>Receipt: '+esc(x.rid)+'<small>'+(/^https:\/\//.test(x.link)?'<a href="'+esc(x.link)+'" target="_blank" rel="noopener noreferrer">'+esc(x.link)+'</a>':esc(x.link))+'</small>'+(x.vn?'<small style="color:#ffb4c8">Auto-check: '+esc(x.vn)+'</small>':'')+'<div class="ar"><input id="amt-'+x.id+'" type="number" inputmode="numeric" min="1" value="'+x.amt+'" aria-label="Amount in birr"><button class="ab ok" data-a="ok" data-id="'+x.id+'">Approve</button><button class="ab no" data-a="no" data-id="'+x.id+'">Decline</button></div></div>'});
    var hist=ps.filter(function(x){return x.st!=='pending'}).slice(-15).reverse();
    if(hist.length)h+='<h4>History</h4><ul class="txl">'+hist.map(function(x){return '<li><span>'+esc(x.u)+' · '+x.amt+' birr<small style="display:block;color:#93a9bd">'+when(x.at||x.ts)+'</small></span><b class="'+STX[x.st][1]+'">'+STX[x.st][0]+'</b></li>'}).join('')+'</ul>'
  }else{
    h+='<input class="sq" id="sq" placeholder="Search username or phone" aria-label="Search users">';
    var ks=Object.keys(us);if(!ks.length)h+='<p class="note">No registered users yet.</p>';
    ks.forEach(function(n){var r=us[n];
      h+='<div class="ac uc" data-n="'+esc((n+' '+r.phone).toLowerCase())+'"><b>'+esc(n)+'</b> · '+esc(r.phone)+'<small>'+esc(r.time)+'</small>Wallet: <b>'+bal(r)+' birr</b><div class="ar"><input type="number" inputmode="numeric" min="1" placeholder="birr" aria-label="Amount for '+esc(n)+'"><button class="ab ok" data-a="add" data-u="'+esc(n)+'">Add</button><button class="ab" data-a="sub" data-u="'+esc(n)+'" style="background:#b8860b">Deduct</button></div><div class="ar"><button class="ab no" data-a="del" data-u="'+esc(n)+'">Delete user</button></div></div>'})
  }
  return h+'</div>'}
function rr(){var y=window.scrollY,v=$('view');v.classList.add('na');route();window.scrollTo(0,y);setTimeout(function(){v.classList.remove('na')},60)}
function bindAdmin(){
  var af=$('af');if(af)af.onsubmit=async function(e){e.preventDefault();var p=$('ap').value;if(p.length<6){$('err').textContent='Password must be at least 6 characters.';return}if(p!==$('ap2').value){$('err').textContent='Passwords do not match.';return}var h=await hash('admin:'+p);if(!await setAdmin(h)){$('err').textContent='An admin already exists. Log in instead.';route();return}mem.as=true;ls('sb_as',true);route()};
  var al=$('al');if(al)al.onsubmit=async function(e){e.preventDefault();if(await hash('admin:'+$('ap').value)!==adm()){$('err').textContent='Wrong password.';return}mem.as=true;ls('sb_as',true);route()};
  var a=$('adm');if(!a)return;var sq=$('sq');
  if(sq)sq.oninput=function(){var q=sq.value.trim().toLowerCase();document.querySelectorAll('.uc').forEach(function(c){c.hidden=!!q&&c.dataset.n.indexOf(q)<0})};
  a.onclick=function(e){var b=e.target.closest('button');if(!b)return;var t=b.dataset.t,k=b.dataset.a,m=$('amsg');m.textContent='';
    if(t){if(t==='out'){mem.as=false;ls('sb_as',false)}else AT=t;rr();return}
    if(k==='ok'||k==='no'){var ps=pays(),r=ps.filter(function(x){return x.id===b.dataset.id})[0];if(!r||r.st!=='pending')return;
      if(k==='ok'){var amt=Math.floor(Number($('amt-'+r.id).value)),us=users();if(!(amt>0)){m.textContent='Enter a valid amount.';return}if(!us[r.u]){m.textContent='This user no longer exists.';return}
        decide(ps,r,'approved',amt,function(){setBal(us,r.u,bal(us[r.u])+amt,'Top-up',amt)})}else decide(ps,r,'declined');
      rr();return}
    var n=b.dataset.u,us2=users();if(!us2[n])return;
    if(k==='del'){if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to confirm';return}delUser(us2,n);if(session()===n){ls('sb_session',null);mem.session=null}rr();return}
    var v=Math.floor(Number(b.parentNode.querySelector('input').value));
    if(!(v>0)){m.textContent='Enter an amount.';return}
    if(k==='sub'){if(v>bal(us2[n])){m.textContent='Not enough balance to deduct.';return}setBal(us2,n,bal(us2[n])-v,'Admin deduction',-v)}else setBal(us2,n,bal(us2[n])+v,'Admin credit',v);
    rr()}}
function bal(r){return (r.wallet||0)+(r.credits||0)*PAY_BIRR}
function setBal(us,u,v,l,a,cb){var r=us[u];r.wallet=v;r.credits=0;r.tx=(r.tx||[]).concat([{l:l,a:a}]).slice(-20);
  if(!DB){mem.users=us;ls('sb_users',us);if(cb)cb(true);return}
  DB.ref('users/'+ukey(u)).transaction(function(c){if(!c)return c;var nb=bal(c)+a;if(nb<0)return;c.wallet=nb;c.credits=0;c.tx=(Array.isArray(c.tx)?c.tx:Object.values(c.tx||{})).concat([{l:l,a:a}]).slice(-20);return c},function(e,ok){if(cb)cb(!e&&!!ok)})}
function showPay(){$('pt').textContent='ሂሳብ ይክፈሉ '+PAY_BIRR+' ብር ለአንድ ካርቴላ (60 ብር ለሁለት፣ 90 ብር ለሶስት...) በቴሌብር ወደ\n'+PAY_NAME+' : '+PAY_NUM;$('pm').classList.add('show');$('pk').focus()}
$('pk').onclick=function(){$('pm').classList.remove('show')};
var SLOTS=[[10,'4:00 O’clock Day'],[12,'6:00 O’clock Day'],[14,'8:00 O’clock Day'],[16,'10:00 O’clock Day'],[18,'12:00 O’clock Day'],[20,'2:00 O’clock Night']];
function lg(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var mem={users:{},session:null,pay:[],admin:null,as:false};
function users(){return DB?C.users:lg('sb_users',mem.users)}
function session(){return lg('sb_session',mem.session)}
async function hash(s){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sb:'+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ===== Firebase Realtime Database (falls back to this browser if unreachable) ===== */
var FBCFG={apiKey:"AIzaSyDrYOOePFsUCPHCPdNHwB05FPna-F_thvA",authDomain:"wow-878fc.firebaseapp.com",databaseURL:"https://wow-878fc-default-rtdb.firebaseio.com",projectId:"wow-878fc",storageBucket:"wow-878fc.firebasestorage.app",messagingSenderId:"498780669062",appId:"1:498780669062:web:4610c2fba867f2c2a63d07"};
var DB=null,READY=false,C={users:{},pay:[],admin:null,last:null},RT=0,OFF=0,LEFT=null,NS=null;
function ukey(n){return encodeURIComponent(n).replace(/\./g,'%2E')}
function refresh(){clearTimeout(RT);RT=setTimeout(function(){if(!READY)return;var v=location.hash.slice(1)||'home',a=document.activeElement;
  if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;if(v==='admin'||v==='play'||v==='home')rr()},200)}
function initFB(cb){var fin=false,seen={},tm;
  function off(){if(fin)return;fin=true;clearTimeout(tm);DB=null;C.last=lg('sb_last',null);cb()}
  function got(k){if(!fin){seen[k]=1;if(seen.u&&seen.p&&seen.a){fin=true;clearTimeout(tm);cb()}}else refresh()}
  tm=setTimeout(off,8000);
  if(!window.firebase)return off();
  try{firebase.initializeApp(FBCFG);DB=firebase.database();
    DB.ref('users').on('value',function(sn){var v=sn.val()||{},o={};Object.keys(v).forEach(function(k){var r=v[k];if(!r||!r.name)return;r.tx=Array.isArray(r.tx)?r.tx:Object.values(r.tx||{});o[r.name]=r});C.users=o;got('u')},off);
    DB.ref('pays').on('value',function(sn){var v=sn.val()||{};C.pay=Object.keys(v).map(function(k){return v[k]}).sort(function(a,b){return a.ts-b.ts});got('p')},off);
    DB.ref('admin/hash').on('value',function(sn){C.admin=sn.val();got('a')},off);
    DB.ref('.info/serverTimeOffset').on('value',function(sn){OFF=sn.val()||0});
    DB.ref('lastWin').on('value',function(sn){onWin(sn.val())})
  }catch(e){off()}}
function toast(t){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},9000)}
function declareWin(gid,rec,cb){
  if(!DB){var l=lg('sb_last',null);if(l&&l.gid===gid){cb(false);return}ls('sb_last',rec);C.last=rec;cb(true);return}
  DB.ref('lastWin').transaction(function(c){return c&&c.gid===gid?undefined:rec},function(e,ok){cb(!e&&!!ok)})}
function endByOther(v){G.over=true;LEFT=G.gid;stopT();$('oh').textContent='Game over';$('op').textContent='🏆 '+v.u+' won the game with Card #'+v.n+' after '+v.calls+' calls.';$('over').classList.add('show')}
function onWin(v){C.last=v;if(!v)return;var inGame=!!$('cg');
  if(inGame&&G.gid&&G.gid===v.gid&&!G.over&&v.u!==session())endByOther(v);
  if(!inGame&&NS!==v.gid&&now()-v.at<45000&&v.u!==session()){NS=v.gid;toast('🏆 '+v.u+' won the game with Card #'+v.n+'!')}}
setInterval(function(){var u=session();if(!u||!READY)return;var h=location.hash.slice(1);if(h==='game'||h==='admin')return;
  var j=lg('sb_join_'+u,null),g=gameInfo().run;if(j&&g&&g.id===j.gid&&LEFT!==g.id)go('game')},1000);
function su(us,n,f){if(!DB){mem.users=us;ls('sb_users',us);return}DB.ref('users/'+ukey(n)).update(f)}
function newUser(n,rec){rec.name=n;return new Promise(function(res){
  if(!DB){var us=users();us[n]=rec;mem.users=us;ls('sb_users',us);res(true);return}
  DB.ref('users/'+ukey(n)).transaction(function(c){return c?undefined:rec},function(e,ok){if(!e&&ok)C.users[n]=rec;res(!e&&!!ok)})})}
function delUser(us,n){delete us[n];if(DB)DB.ref('users/'+ukey(n)).remove();else{mem.users=us;ls('sb_users',us)}}
function setAdmin(h){return new Promise(function(res){if(!DB){mem.admin=h;ls('sb_admin',h);res(true);return}
  DB.ref('admin/hash').transaction(function(c){return c?undefined:h},function(e,ok){if(!e&&ok)C.admin=h;res(!e&&!!ok)})})}
function addPay(x){if(DB){C.pay.push(x);return DB.ref('pays/'+x.id).set(x)}var l=pays();l.push(x);sp(l);return Promise.resolve()}
function note(t){$('pt').textContent=t;$('pm').classList.add('show');$('pk').focus()}
function decide(ps,r,st,amt,done){r.at=Date.now();
  if(!DB){r.st=st;if(amt)r.amt=amt;sp(ps);if(done)done();return}
  var at=r.at;r.st=st;if(amt)r.amt=amt;
  DB.ref('pays/'+r.id).transaction(function(c){if(!c||c.st!=='pending')return;c.st=st;if(amt)c.amt=amt;c.at=at;return c},function(e,ok){if(!e&&ok&&done)done()})}

/* menu */
var NAV=[['home','⌂','Home'],['home','⇥','Login','in'],['register','✚','Register','in'],['out','⇤','Sign Out','auth'],['schedule','☰','Schedule'],['how','ⓘ','How to Play'],['about','●','About Us'],['contact','✉','Contact Us'],['faqs','?','FAQs'],['admin','⚙','Admin']];
function menu(v){
  var u=session(),h='<div class="logo">YEME<small>BINGO</small></div><div class="who">'+(u?'◉ '+esc(u):'☰ Menu')+'</div><p class="note" style="padding:8px">'+(DB?'☁ Cloud connected':'⚠ Local mode (no cloud)')+'</p>';
  NAV.forEach(function(n){if(n[3]==='in'&&u)return;if(n[3]==='auth'&&!u)return;
    h+='<a data-go="'+n[0]+'" class="'+(n[0]===v&&n[2]!=='Login'||(n[2]==='Login'&&0)?'act':'')+'" tabindex="0"><span>'+n[1]+'</span>'+n[2]+'</a>'});
  $('dr').innerHTML=h;
}
function toggle(o){var open=o===undefined?!$('dr').classList.contains('open'):o;$('dr').classList.toggle('open',open);$('sc').classList.toggle('show',open);var m=$('mb');m.className=open?'x':'';m.textContent=open?'×':'☰'}
$('mb').onclick=function(){toggle()};$('sc').onclick=function(){toggle(false)};
document.addEventListener('click',function(e){var t=e.target.closest('[data-go]');if(!t)return;var g=t.dataset.go;
  if(g==='out'){ls('sb_session',null);mem.session=null;go('home')}else go(g)});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches('#dr a'))e.target.click()});
function go(v){toggle(false);if(location.hash==='#'+v)route();else location.hash=v}

/* countdown */
function now(){return Date.now()+OFF}
function slotStart(d,h){var e=new Date(now()+108e5);return Date.UTC(e.getUTCFullYear(),e.getUTCMonth(),e.getUTCDate()+d,h-3,0,0)}
function gidOf(t){return 'g'+new Date(t+108e5).toISOString().slice(0,13).replace(/\D/g,'')}
var INT=4000,WIN=75*INT+30000,CUR=null;
/* Games run on Ethiopian time (UTC+3). run = game being played now (not yet won), next = the upcoming game */
function gameInfo(){var n=now(),run=null,next=null;
  for(var d=-1;d<=2;d++)for(var i=0;i<SLOTS.length;i++){var t=slotStart(d,SLOTS[i][0]),o={t:t,l:SLOTS[i][1],id:gidOf(t)};
    if(n>=t&&n<t+WIN&&!(C.last&&C.last.gid===o.id))run=o;
    if(t>n&&!next)next=o}
  return {run:run,next:next}}
function nextSlot(){return gameInfo().next}
function tick(){var el=$('cd');if(!el)return;var l=$('cdl');
  if(CUR&&CUR.free){el.textContent='Practice';if(l)l.textContent='Balls are called every 3 seconds';return}
  var gi=gameInfo(),s=gi.next,ms=Math.max(0,s.t-now()),H=Math.floor(ms/36e5),M=Math.floor(ms/6e4)%60,S=Math.floor(ms/1e3)%60;
  el.textContent=H+'H:'+M+'M:'+S+'S';
  if(l)l.textContent=(gi.run?'A game is in progress · ':'')+'Next game: BINGO Game at '+s.l}
setInterval(tick,1000);

/* pages */

var USER='<svg class="ic" viewBox="0 0 24 24" fill="#333"><circle cx="12" cy="7.5" r="4.5"/><path d="M3 21c0-5 4-7.5 9-7.5s9 2.5 9 7.5z"/></svg>';
var timeOpts=SLOTS.map(function(s){return '<option value="'+s[1]+'">BINGO Game at '+s[1]+'</option>'}).join('');
var P={
home:function(){var u=session();
  var body=u?'<div class="panel"><h2>Welcome, '+esc(u)+'</h2><p style="text-align:center;font-size:18px;color:var(--mut)">Next game: '+esc(gameInfo().next.l)+'</p><p style="text-align:center;font-size:18px;color:var(--mut)">Wallet: '+bal(users()[u]||{})+' birr</p><button class="btn p" data-go="play">▶ Play now</button></div>':
  '<div class="panel">'+USER+'<h2>⇥ Login</h2><form id="lf" novalidate><div class="fld"><label for="lu">Username</label><input id="lu" autocomplete="username" placeholder="Enter Username"></div><div class="fld"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" placeholder="Enter Password"></div><div class="err" id="err" role="alert"></div><hr class="sep" style="margin-top:6px"><button class="btn p" type="submit">⇥ Login</button></form></div><button class="btn g" data-go="register">✚ Register</button>';
  return BAN+'<div class="cd" id="cd">0H:0M:0S</div><div class="cdl" id="cdl"></div>'+body+'<button class="btn o" data-go="play">▶ Play For Free</button>'},
register:function(){return '<div class="panel">'+USER+'<h2>User Registration</h2><form id="rf" novalidate><div class="fld"><label for="ru">Username</label><input id="ru" autocomplete="username" placeholder="Enter Username"></div><div class="fld"><label for="rph">Phone No</label><input id="rph" type="tel" inputmode="tel" placeholder="Enter Phone Number"></div><div class="fld"><label for="rt">Playing Time</label><select id="rt"><option value="">---------Select BINGO Playing Time----</option>'+timeOpts+'</select></div><div class="fld"><label for="rp">Password</label><input id="rp" type="password" autocomplete="new-password" placeholder="Enter Password"></div><div class="fld"><label for="rp2">Confirm Password</label><input id="rp2" type="password" autocomplete="new-password" placeholder="Enter Password Again"></div><div class="err" id="err" role="alert"></div><hr class="sep" style="margin-top:6px"><button class="btn p" type="submit">✚ Register</button></form><div class="hv">ⓘ Have an account <a data-go="home">Login</a></div></div>'},
schedule:function(){var s=nextSlot(),r=SLOTS.map(function(x){return '<tr class="'+(x[1]===s.l?'nx':'')+'"><td>BINGO Game</td><td>'+x[1]+'</td></tr>'}).join('');
  return '<div class="panel txt"><h2>Schedule</h2><table><tr><th>Game</th><th>Time</th></tr>'+r+'</table><p style="color:var(--mut)">The highlighted row is the next game.</p></div>'},
how:function(){return '<div class="panel txt"><h2>How to Play</h2><ol><li>Register and choose your playing time, or tap Play For Free.</li><li>Pay '+PAY_BIRR+' birr per cartela (60 birr = 2, 90 birr = 3 …). Payments below '+PAY_BIRR+' birr are not confirmed.</li><li>Tap one or more card numbers (1–30). Each cartela costs '+PAY_BIRR+' birr, and the last card you tapped shows in the preview. Then press Start Game. Columns are B (1–15), I (16–30), N (31–45), G (46–60) and O (61–75). The center is free.</li><li>The game starts automatically for everyone when the countdown ends. All players get the same numbers, which light up on the board; the first player to complete the goal and press Bingo wins and the game ends for all. The Target Goal shows the pattern you need.</li><li>Tap a called number on your card to mark it, or turn on Auto-mark.</li><li>Complete the Target Goal and press Bingo!</li></ol></div>'},
about:function(){return '<div class="panel txt"><h2>About Us</h2><p>YEME BINGO is a single-player bingo game. Play on your own card at your own pace, with scheduled game times to keep it fun.</p></div>'},
contact:function(){return '<div class="panel txt"><h2>Contact Us</h2><p>Contact details have not been set up yet. Tell me the phone numbers, email or Telegram link you want here and I’ll add them.</p></div>'},
faqs:function(){return '<div class="panel txt"><h2>FAQs</h2><details><summary>Is it free to play?</summary><p>Yes. Play For Free needs no account.</p></details><details><summary>How much is a cartela?</summary><p>'+PAY_BIRR+' birr for one cartela, 60 birr for two, 90 birr for three, and so on. Payments below '+PAY_BIRR+' birr are not confirmed.</p></details><details><summary>Do I need an account?</summary><p>An account lets you pick a playing time and keeps your stats on this device.</p></details><details><summary>How do I win?</summary><p>Mark the called numbers and complete the Target Goal, then press Bingo!</p></details><details><summary>Where is my account stored?</summary><p>In this browser only. Clearing site data removes it.</p></details></div>'},
play:function(){var u=session(),rec=u&&users()[u],t=rec?rec.time.split(' ')[0]:'',dn=rec&&/Night/.test(rec.time)?'ሌሊት':'ቀን';
 var info=rec?'INFO : የእርስዎ ቢንጎ ጨዋታ '+t+' ሰዓት '+dn+' የሚጀምር ሲሆን ከ '+t+' ሰዓት ቀደም ብለው Start Game ሚለውን በተን ይጫኑ.':'INFO : Practice game. Press Start Game to start now. Register to join the scheduled games.';
 var pay=rec?'<div class="wal"><small>Wallet balance</small><b>'+bal(rec)+' birr</b><small>'+cartelas(bal(rec))+' cartela'+(cartelas(bal(rec))===1?'':'s')+' available · '+PAY_BIRR+' birr each</small></div>'+(rec.tx&&rec.tx.length?'<ul class="txl">'+rec.tx.slice(-5).reverse().map(function(x){return '<li><span>'+esc(x.l)+'</span><b class="'+(x.a>0?'cr':'db')+'">'+(x.a>0?'+':'')+x.a+'</b></li>'}).join('')+'</ul>':'')+reqHTML(u)+'<h4>Add money</h4>'+('<div class="fld"><label for="ra">Amount paid (birr)</label><input id="ra" type="number" inputmode="numeric" min="0" step="1" placeholder="'+PAY_BIRR+' birr = 1 cartela"></div><div class="fld"><label for="rl">Telebirr receipt link or number</label><input id="rl" placeholder="https://transactioninfo.ethiotelecom.et/receipt/..." autocapitalize="off" autocomplete="off"></div><button class="btn p s" id="pd">Submit payment</button><p class="note">'+PAY_BIRR+' birr = 1 cartela, 60 = 2, 90 = 3 … Below '+PAY_BIRR+' birr is not confirmed. '+(VERIFY_URL?'Your payment is checked automatically. If it can’t be confirmed, the admin reviews it.':'The admin checks your payment and adds it to your wallet once approved.')+'</p>'):'';
 var tm='';
 return BAN+'<div class="cd" id="cd"></div><div class="cdl" id="cdl"></div><h4>Select Card Number</h4><div class="nums" id="nm"></div><p class="sumry" id="sm" aria-live="polite"></p><h4 id="ph">Card Preview</h4><div class="pcard"><div class="grid" id="pv"></div></div><div class="pr"><button class="pill t" id="rfr">Refresh</button><button class="pill o" id="pb">Start Game</button></div><p class="sumry" id="gst" style="font-weight:500;line-height:1.5"></p><div class="info">'+info+'</div>'+pay+'<div id="msg" role="status"></div>'+tm+'<div class="soc"><b style="background:#3b5998">f</b><b style="background:#55acee">t</b><b style="background:#f08a1c">◉</b></div><div class="ad"><p>Advertisement</p><div></div></div>'},
admin:function(){
  if(!adm())return '<div class="panel"><h2>Admin Setup</h2><p class="note">First time here: create the admin password.</p><form id="af" novalidate><div class="fld"><label for="ap">Password</label><input id="ap" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><div class="fld"><label for="ap2">Confirm Password</label><input id="ap2" type="password" autocomplete="new-password"></div><div class="err" id="err" role="alert"></div><button class="btn p" type="submit">Create admin</button></form></div>';
  if(!isAdm())return '<div class="panel"><h2>Admin Login</h2><form id="al" novalidate><div class="fld"><label for="ap">Password</label><input id="ap" type="password" autocomplete="current-password"></div><div class="err" id="err" role="alert"></div><button class="btn p" type="submit">Login</button></form></div>';
  return adminPanel()},
game:function(){return '<div class="goal"><span>Target Goal:</span><b id="gl"></b></div><div class="board"><div class="bgr" id="bd"></div><p class="last" id="lst" aria-live="polite"></p></div><div id="cg"></div><div id="msg" role="status"></div><button class="bingo" id="bg">Bingo!</button><div class="opt"><label><input type="checkbox" id="au"> Auto-mark</label><button id="bk">‹ Back</button></div>'}
};

/* forms */
function bindForms(){
  var lf=$('lf');if(lf)lf.onsubmit=async function(e){e.preventDefault();var n=$('lu').value.trim(),p=$('lp').value,us=users(),k=Object.keys(us).filter(function(x){return x.toLowerCase()===n.toLowerCase()})[0];
    if(!n||!p){$('err').textContent='Enter your username and password.';return}
    if(!k||us[k].pw!==await hash(p)){$('err').textContent='Wrong username or password.';return}
    ls('sb_session',k);mem.session=k;go('play')};
  var rf=$('rf');if(rf)rf.onsubmit=async function(e){e.preventDefault();var n=$('ru').value.trim(),ph=$('rph').value.replace(/[\s-]/g,''),t=$('rt').value,p=$('rp').value,p2=$('rp2').value,us=users(),er='';
    if(n.length<3)er='Username must be at least 3 characters.';
    else if(Object.keys(us).some(function(x){return x.toLowerCase()===n.toLowerCase()}))er='That username is taken.';
    else if(!/^\+?\d{9,13}$/.test(ph))er='Enter a valid phone number.';
    else if(!t)er='Select your BINGO playing time.';
    else if(p.length<4)er='Password must be at least 4 characters.';
    else if(p!==p2)er='Passwords do not match.';
    if(er){$('err').textContent=er;return}
    if(!await newUser(n,{phone:ph,time:t,pw:await hash(p)})){$('err').textContent='That username is taken.';return}ls('sb_session',n);mem.session=n;go('play')};
}

/* game */
var G={m:{'2,2':1},called:[],card:null};
function rg(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function seq(seed){return shuf(rg(1,75),rng(seed))}
/* card number (1-30) + refresh seed always give the same card */
function cardFor(n,seed){var r=rng(seed*1000+n*7919+13),c=[];for(var i=0;i<5;i++)c.push(shuf(rg(i*15+1,i*15+15),r).slice(0,5));c[2][2]=0;return c}
var MAX_CARDS=10;
function csel(){var s=lg('sb_sel_'+(session()||'guest'),{n:1,seed:1,sel:[1]});if(!s.sel)s.sel=[s.n||1];return s}
function mkCards(s){return s.sel.slice().sort(function(a,b){return a-b}).map(function(n){return {n:n,card:cardFor(n,s.seed),m:{'2,2':1}}})}
function ssel(s){ls('sb_sel_'+(session()||'guest'),s)}
function mkGoals(){var L=[],i,j,d1=[],d2=[];
  for(i=0;i<5;i++){var r=[],c=[];for(j=0;j<5;j++){r.push([j,i]);c.push([i,j])}L.push(r,c)}
  for(j=0;j<5;j++){d1.push([j,j]);d2.push([j,4-j])}
  var row=function(i){return L[i*2]},col=function(i){return L[i*2+1]};
  return [{n:'Any Line',s:L.concat([d1,d2])},{n:'Left & Right Columns',s:[col(0).concat(col(4))]},{n:'Top & Bottom Rows',s:[row(0).concat(row(4))]},{n:'Four Corners',s:[[[0,0],[4,0],[0,4],[4,4]]]},{n:'Both Diagonals',s:[d1.concat(d2)]}]}
var GOALS=mkGoals();
function stopT(){if(G.t){clearInterval(G.t);G.t=null}}
function cellsHTML(card,m,tag,k){var h='';for(var r=0;r<5;r++)for(var c=0;c<5;c++){var n=card[c][r],cl='cell';if(!n)cl+=' free';else if(m&&m[c+','+r])cl+=' on';
  h+='<'+tag+' class="'+cl+'"'+(tag==='button'?' data-k="'+k+'" data-c="'+c+'" data-r="'+r+'" aria-label="'+(n?'BINGO'[c]+' '+n:'Free space')+'"':'')+'>'+(n||'★')+'</'+tag+'>'}return h}
function drawNums(){var s=csel(),h='';for(var n=1;n<=30;n++)h+='<button class="nb'+(n===s.n?' cur':'')+'" data-n="'+n+'" aria-pressed="'+(s.sel.indexOf(n)>-1)+'" aria-label="Card '+n+'">'+n+'</button>';$('nm').innerHTML=h}
function drawSum(){var s=csel(),n=s.sel.length;$('sm').textContent=n?n+' cartela'+(n>1?'s':'')+' selected (#'+s.sel.slice().sort(function(a,b){return a-b}).join(', #')+') · '+n*PAY_BIRR+' birr':'No card selected'}
function drawPrev(){var s=csel();$('pv').innerHTML=cellsHTML(cardFor(s.n,s.seed),null,'div',0);$('ph').textContent='Card Preview · #'+s.n}
function drawCard(){var g=$('cg');if(!g)return;var hd='';'BINGO'.split('').forEach(function(l){hd+='<div class="hdr">'+l+'</div>'});
  g.innerHTML=G.cards.map(function(K,i){return '<div class="gcard"><p class="ctitle">Card #'+K.n+'</p><div class="grid">'+hd+cellsHTML(K.card,K.m,'button',i)+'</div></div>'}).join('');
  var b=$('bd');if(b){var t=G.called[G.called.length-1],x='';for(var n=1;n<=75;n++)x+='<div class="bn'+(G.called.indexOf(n)>-1?' c':'')+(n===t?' l':'')+'">'+n+'</div>';b.innerHTML=x;
    $('lst').textContent=t?'Called '+G.called.length+' of 75 · Last: '+'BINGO'[Math.floor((t-1)/15)]+' '+t:'Waiting for the first call…'}}
function initLobby(){var u=session(),rec=u&&users()[u];G.over=false;G.called=[];drawNums();drawPrev();drawSum();
  CUR=rec?null:{free:true};lobbyStatus(u,rec);
  $('nm').onclick=function(e){var b=e.target.closest('.nb');if(!b)return;var s=csel(),n=+b.dataset.n,i=s.sel.indexOf(n);
    if(i>-1){s.sel.splice(i,1);if(s.n===n&&s.sel.length)s.n=s.sel[s.sel.length-1]}
    else{if(s.sel.length>=MAX_CARDS){$('sm').textContent='You can select up to '+MAX_CARDS+' cartelas.';return}s.sel.push(n);s.n=n}
    ssel(s);drawNums();drawPrev();drawSum()};
  $('rfr').onclick=function(){var s=csel();s.seed=Math.floor(Math.random()*1e6)+1;ssel(s);drawPrev()};
  $('pb').onclick=function(){var s=csel(),k=s.sel.length,cost=k*PAY_BIRR;if(!k){$('sm').textContent='Select at least one card.';return}
    if(rec){var nx=gameInfo().next,j=lg('sb_join_'+u,null);if(j&&j.gid===nx.id)return;
      var us=users(),r=us[u];if(bal(r)<cost){$('sm').textContent='Not enough wallet balance: '+k+' cartela'+(k>1?'s':'')+' cost '+cost+' birr. Add money first.';showPay();return}
      setBal(us,u,bal(r)-cost,'Cartela '+(k>1?'×'+k+' (#'+s.sel.join(', #')+')':'#'+s.sel[0]),-cost,function(ok){if(!ok){$('sm').textContent='Not enough wallet balance. Add money first.';return}
        ls('sb_join_'+u,{gid:nx.id,sel:s.sel.slice().sort(function(a,b){return a-b}),seed:s.seed});route();note('✔ You joined the '+nx.l+' game with '+k+' cartela'+(k>1?'s':'')+'. It starts automatically when the countdown ends.')});return}
    go('game')};
  var pd=$('pd');if(pd)pd.onclick=function(){var m=$('rl').value.trim().match(/^(?:https?:\/\/transactioninfo\.ethiotelecom\.et\/receipt\/)?([A-Za-z0-9]{8,14})\/?$/),ms=$('msg'),amt=Math.floor(Number($('ra').value));
    if(!(amt>=PAY_BIRR)){ms.textContent='Payment below '+PAY_BIRR+' birr is not confirmed.';return}
    if(!m){ms.textContent='Enter the receipt link or number from your Telebirr SMS.';return}
    var id=m[1].toUpperCase(),l=pays();
    if(l.some(function(x){return x.rid===id&&x.st!=='declined'})){ms.textContent='This receipt was already submitted.';return}
    var np={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),u:u,amt:amt,rid:id,link:$('rl').value.trim(),ts:Date.now(),st:'pending'},auto=!!(DB&&VERIFY_URL);
    if(auto){pd.disabled=true;ms.textContent='Checking your payment…'}
    addPay(np).then(function(){
      if(!auto){route();return}
      return fetch(VERIFY_URL.replace(/\/$/,'')+'/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:np.id})}).then(function(r){return r.json()}).then(function(j){
        note(j.ok?'✔ Payment confirmed. '+j.amount+' birr was added to your wallet.':'Payment received, but it could not be confirmed automatically ('+(j.reason||'unknown reason')+'). The admin will review it.');route()
      }).catch(function(){note('Payment received. The admin will review it.');route()})
    })};
  }
function lobbyStatus(u,rec){var gi=gameInfo(),nx=gi.next,j=u?lg('sb_join_'+u,null):null,t='',b=$('pb');
  if(!rec)t='Practice game: press Start Game to play now. Log in to join the scheduled games.';
  else if(j&&j.gid===nx.id){t='✔ You joined the game at '+nx.l+' with '+j.sel.length+' cartela'+(j.sel.length>1?'s':'')+' (#'+j.sel.join(', #')+'). It starts automatically when the countdown ends.';b.textContent='✔ Joined';b.disabled=true}
  else{t=gi.run?'A game is in progress, so joining is closed. Join the next game at '+nx.l+'.':'Select your cartelas and press Join Game before the countdown ends.';b.textContent='Join Game'}
  $('gst').textContent=t}
function endGame(){G.over=true;LEFT=G.gid;stopT();}
function loop(){var el=now()-G.start,c=el<0?0:Math.min(75,Math.floor(el/G.int)+1),ch=false;
  while(G.called.length<c){G.called.push(G.seq[G.called.length]);ch=true}
  if($('au')&&$('au').checked)G.cards.forEach(function(K){G.called.forEach(function(n){for(var a=0;a<5;a++)for(var b=0;b<5;b++)if(K.card[a][b]===n&&!K.m[a+','+b]){K.m[a+','+b]=1;ch=true}})});
  if(ch)drawCard();
  if(G.called.length>=75&&!G.over){$('msg').textContent='All 75 balls are called. Game over.';endGame()}}
function confetti(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;var w=document.createElement('div');w.className='cf';w.setAttribute('aria-hidden','true');
  for(var i=0;i<46;i++){var p=document.createElement('i');p.style.cssText='left:'+Math.random()*100+'%;background:'+['#f6d77a','#a855f7','#fff3c9','#d99a1e','#7b2ff7'][i%5]+';animation-delay:'+Math.random()*.8+'s;animation-duration:'+(1.8+Math.random()*1.6)+'s;transform:rotate('+Math.random()*360+'deg)';w.appendChild(p)}
  document.body.appendChild(w);setTimeout(function(){w.remove()},4200)}
function claim(){if(G.over||G.claiming)return;var wk=-1,w=null;
  G.cards.forEach(function(K,i){if(w)return;var l=G.goal.s.filter(function(l){return l.every(function(p){return K.m[p[0]+','+p[1]]})})[0];if(l){w=l;wk=i}});
  if(!w){$('msg').textContent='Not yet. Mark every called number for the goal: '+G.goal.n+'.';return}
  var v={gid:G.gid,u:session()||'Guest',n:G.cards[wk].n,calls:G.called.length,at:now()};
  var fin=function(){$('msg').textContent='';var cs=document.querySelectorAll('#cg .gcard')[wk].querySelectorAll('.cell');w.forEach(function(p){cs[p[1]*5+p[0]].classList.add('win')});
    var st=lg('sb_stats',{won:0,best:0});st.won++;if(!st.best||v.calls<st.best)st.best=v.calls;ls('sb_stats',st);
    $('oh').textContent='BINGO! You won';$('op').textContent='Card #'+v.n+' won in '+v.calls+' calls. Wins: '+st.won+', best: '+st.best+' calls.';endGame();confetti();setTimeout(function(){$('over').classList.add('show')},700)};
  if(!G.gid){fin();return}
  G.claiming=true;declareWin(G.gid,v,function(ok){G.claiming=false;if(ok)fin();else $('msg').textContent='Too late: another player already won this game.'})}
function initGame(){var u=session(),rec=u&&users()[u];G.over=false;G.called=[];G.claiming=false;
  if(rec){var j=lg('sb_join_'+u,null),g=gameInfo().run;if(!j||!g||j.gid!==g.id){go('play');return}
    G.gid=g.id;G.start=g.t;G.seed=g.t;G.int=INT;G.cards=mkCards({sel:j.sel,seed:j.seed});G.goal=GOALS[Math.floor(G.seed/72e5)%GOALS.length]}
  else{G.gid=null;G.start=Date.now();G.seed=Math.floor(Math.random()*1e9);G.int=3000;G.cards=mkCards(csel());G.goal=GOALS[G.seed%GOALS.length]}
  if(!G.cards.length){go('play');return}
  CUR=null;G.seq=seq(G.seed);$('gl').textContent=G.goal.n;drawCard();
  $('cg').onclick=function(e){var b=e.target.closest('.cell');if(!b||!b.dataset.c||G.over)return;var K=G.cards[+b.dataset.k],c=+b.dataset.c,r=+b.dataset.r,n=K.card[c][r];if(!n)return;
    if(G.called.indexOf(n)<0){b.classList.add('sh');setTimeout(function(){b.classList.remove('sh')},300);$('msg').textContent=n+' hasn’t been called yet.';return}
    var k=c+','+r;if(K.m[k])delete K.m[k];else K.m[k]=1;b.classList.toggle('on');$('msg').textContent=''};
  $('bg').onclick=claim;$('bk').onclick=function(){LEFT=G.gid;go('play')};G.t=setInterval(loop,500);loop()}
$('again').onclick=function(){go('play')};

function route(){if(!READY)return;var v=(location.hash||'#home').slice(1);if(!P[v])v='home';stopT();CUR=null;
  document.body.classList.toggle('arena',v==='play'||v==='game'||v==='admin');
  $('view').innerHTML=P[v]();menu(v);bindForms();bindAdmin();$('over').classList.remove('show');
  if(v==='play')initLobby();if(v==='game')initGame();tick();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);$('view').innerHTML='<p class="note" style="padding:60px 0">Connecting…</p>';initFB(function(){READY=true;route()});
})();
