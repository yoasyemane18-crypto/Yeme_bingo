<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatWave</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root[data-theme="dark"] {
    --bg:#0A0C12; --surface:#12151D; --surface-2:#171B26; --surface-3:#1D2230;
    --glass:rgba(18,21,29,0.72); --border:rgba(255,255,255,0.07); --border-strong:rgba(255,255,255,0.14);
    --text:#F1F2F6; --text-dim:#8B90A3; --text-faint:#565B70;
    --accent:#7C5CFF; --accent-2:#2DD4BF; --accent-soft:rgba(124,92,255,0.14);
    --online:#34D399; --danger:#FB7185; --warn:#F59E0B;
    --bubble-me:linear-gradient(135deg,#7C5CFF 0%,#5B79EF 100%); --bubble-them:#1B1F2B;
    --shadow:0 12px 32px rgba(0,0,0,0.45); --on-accent:#fff;
  }
  :root[data-theme="light"] {
    --bg:#EFEFF4; --surface:#FFFFFF; --surface-2:#F6F6FA; --surface-3:#ECECF3;
    --glass:rgba(255,255,255,0.75); --border:rgba(10,12,18,0.08); --border-strong:rgba(10,12,18,0.14);
    --text:#14161C; --text-dim:#666B80; --text-faint:#9A9EB0;
    --accent:#6C4CFF; --accent-2:#0FA898; --accent-soft:rgba(108,76,255,0.10);
    --online:#0EA371; --danger:#E11D48; --warn:#D97706;
    --bubble-me:linear-gradient(135deg,#6C4CFF 0%,#4C6FEF 100%); --bubble-them:#F0F0F6;
    --shadow:0 12px 32px rgba(20,22,28,0.10); --on-accent:#fff;
  }

  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .font-display { font-family:'Space Grotesk',sans-serif; }
  .font-mono { font-family:'JetBrains Mono',monospace; }
  button { font-family:inherit; cursor:pointer; }
  input { font-family:inherit; }
  img { -webkit-user-drag:none; user-select:none; }

  .no-scrollbar::-webkit-scrollbar { width:6px; height:6px; }
  .no-scrollbar::-webkit-scrollbar-thumb { background:rgba(140,140,160,0.25); border-radius:8px; }
  .no-scrollbar::-webkit-scrollbar-track { background:transparent; }

  @keyframes breathe { 0%,100%{ box-shadow:0 0 0 0 rgba(52,211,153,.55);} 50%{ box-shadow:0 0 0 5px rgba(52,211,153,0);} }
  .breathe { animation:breathe 2.2s ease-in-out infinite; }
  @keyframes rise { from{opacity:0;transform:translateY(10px) scale(.98);} to{opacity:1;transform:translateY(0) scale(1);} }
  .rise { animation:rise .28s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes popIn { from{opacity:0;transform:scale(.85);} to{opacity:1;transform:scale(1);} }
  .popIn { animation:popIn .2s ease-out both; }
  @keyframes shimmerRing { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
  .shimmer-ring { animation:shimmerRing 3.5s linear infinite; }
  @keyframes bounceDot { 0%,60%,100%{transform:translateY(0);opacity:.4;} 30%{transform:translateY(-4px);opacity:1;} }
  .dot1{animation:bounceDot 1.2s infinite ease-in-out;} .dot2{animation:bounceDot 1.2s infinite ease-in-out .15s;} .dot3{animation:bounceDot 1.2s infinite ease-in-out .3s;}
  @keyframes slideInRight { from{transform:translateX(100%);} to{transform:translateX(0);} }
  .slide-in-right { animation:slideInRight .32s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  .fade-up { animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pulseRec { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .pulse-rec { animation:pulseRec 1s infinite; }
  @keyframes gradShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

  a, button, input { outline:none; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ---------- ONBOARDING ---------- */
  #onboarding-screen {
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
    background-image: radial-gradient(circle at 15% 15%, var(--accent-soft), transparent 45%),
                       radial-gradient(circle at 85% 85%, rgba(45,212,191,0.10), transparent 45%);
  }
  .onboard-card {
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border);
    border-radius:24px; padding:36px 32px; box-shadow:var(--shadow);
  }
  .onboard-logo {
    width:56px; height:56px; border-radius:18px; margin:0 auto 20px;
    background:linear-gradient(135deg,#7C5CFF,#2DD4BF); background-size:200% 200%;
    animation:gradShift 4s ease infinite;
    display:flex; align-items:center; justify-content:center;
  }
  .field-input {
    width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid var(--border-strong);
    background:var(--surface-2); color:var(--text); font-size:14.5px; transition:border-color .15s, box-shadow .15s;
  }
  .field-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .field-wrap { position:relative; }
  .field-wrap .field-input { padding-right:44px; }
  .field-eye {
    position:absolute; right:6px; top:50%; transform:translateY(-50%); width:32px; height:32px;
    border-radius:9px; border:none; background:none; color:var(--text-faint); display:flex; align-items:center; justify-content:center;
  }
  .field-eye:hover { color:var(--text-dim); }
  .primary-btn {
    width:100%; padding:13px 14px; border-radius:14px; border:none; background:var(--bubble-me);
    color:#fff; font-weight:600; font-size:14.5px; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s, opacity .15s; box-shadow:0 8px 20px rgba(124,92,255,0.28);
  }
  .primary-btn:hover { transform:translateY(-1px); }
  .primary-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  .ghost-btn {
    background:none; border:none; color:var(--accent); font-weight:600; font-size:13px; padding:8px;
  }
  .mode-toggle { display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:4px; margin-bottom:22px; }
  .mode-toggle button { flex:1; padding:9px 0; border:none; background:none; border-radius:10px; font-size:13.5px; font-weight:600; color:var(--text-dim); transition:all .15s; }
  .mode-toggle button.active { background:var(--surface); color:var(--accent); box-shadow:0 2px 6px rgba(0,0,0,0.12); }
  .pw-checklist { display:flex; flex-direction:column; gap:5px; margin-top:10px; }
  .pw-check-item { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--text-faint); transition:color .15s; }
  .pw-check-item.met { color:var(--online); }
  .pw-check-item i { width:13px; height:13px; flex-shrink:0; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spin { animation:spin .8s linear infinite; }
  .code-boxes { display:flex; gap:10px; justify-content:center; margin:18px 0 6px; }
  .code-box {
    width:46px; height:54px; border-radius:12px; border:1.5px solid var(--border-strong);
    background:var(--surface-2); color:var(--text); font-size:20px; text-align:center;
    font-family:'JetBrains Mono',monospace; font-weight:500; transition:border-color .15s, box-shadow .15s;
  }
  .code-box:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .success-banner {
    background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.35); color:var(--online);
    font-size:12.5px; border-radius:12px; padding:10px 12px; margin-bottom:16px; display:flex; align-items:center; gap:8px;
  }
  .demo-note {
    background:var(--accent-soft); border-radius:12px; padding:10px 14px; margin-top:16px; text-align:center;
  }
  .setup-card { width:100%; max-width:480px; }
  .setup-step { display:flex; gap:12px; padding:12px 2px; border-bottom:1px solid var(--border); }
  .setup-step:last-child { border-bottom:none; }
  .setup-num {
    width:24px; height:24px; border-radius:9999px; background:var(--accent-soft); color:var(--accent); font-weight:700;
    font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .code-inline { font-family:'JetBrains Mono',monospace; background:var(--surface-2); padding:2px 6px; border-radius:6px; font-size:12.5px; }
  .avatar-choice {
    width:56px; height:56px; border-radius:9999px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:600; font-family:'Space Grotesk',sans-serif; font-size:18px; cursor:pointer;
    border:2.5px solid transparent; transition:border-color .15s, transform .12s;
  }
  .avatar-choice.selected { border-color:var(--text); transform:scale(1.08); }

  /* ---------- APP LAYOUT ---------- */
  #app-root { display:none; width:100%; height:100vh; overflow:hidden; }
  #app-root.active { display:flex; }

  #rail {
    width:76px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; padding:20px 0; gap:6px;
  }
  .rail-logo {
    width:42px; height:42px; border-radius:14px; margin-bottom:18px;
    background:linear-gradient(135deg,#7C5CFF,#2DD4BF); display:flex; align-items:center; justify-content:center;
  }
  .rail-btn {
    width:46px; height:46px; border-radius:14px; border:none; cursor:pointer; background:transparent;
    color:var(--text-dim); display:flex; align-items:center; justify-content:center; position:relative;
    transition:all .18s;
  }
  .rail-btn.active { background:var(--accent-soft); color:var(--accent); }
  .rail-badge {
    position:absolute; top:2px; right:2px; background:var(--danger); color:#fff; font-size:9px; font-weight:600;
    border-radius:9999px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  #list-panel { width:380px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100%; }
  #conv-panel { flex:1; display:flex; flex-direction:column; height:100%; min-width:0; position:relative; }

  .icon-btn {
    width:36px; height:36px; border-radius:10px; border:none; background:transparent; color:var(--text-dim);
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s,color .15s;
  }
  .icon-btn:hover { background:var(--surface-2); color:var(--accent); }

  .search-wrap { position:relative; }
  .search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint); pointer-events:none; }
  .search-input {
    width:100%; padding:10px 12px 10px 36px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:13.5px;
  }

  .chat-row {
    display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px; cursor:pointer; margin-bottom:2px;
    transition:background .15s;
  }
  .chat-row:hover { background:var(--surface-2); }
  .chat-row.selected { background:var(--accent-soft); }
  .chat-row.selected:hover { background:var(--accent-soft); }

  .avatar-wrap { position:relative; flex-shrink:0; }
  .avatar {
    border-radius:9999px; display:flex; align-items:center; justify-content:center; color:#fff;
    font-weight:600; font-family:'Space Grotesk',sans-serif; user-select:none; position:relative; z-index:1;
  }
  .avatar-online-dot {
    position:absolute; bottom:1px; right:1px; border-radius:9999px; background:var(--online);
    border:2.5px solid var(--surface); z-index:2;
  }
  .ring-wrap { position:absolute; border-radius:9999px; padding:2px; }
  .ring-wrap .avatar { position:relative; }

  .badge-unread {
    background:var(--accent); color:#fff; font-size:10.5px; font-weight:600; min-width:18px; height:18px;
    border-radius:9999px; display:flex; align-items:center; justify-content:center; padding:0 5px;
  }

  .bottom-tabs { display:flex; border-top:1px solid var(--border); padding:6px 0; }
  .bottom-tab-btn {
    flex:1; background:none; border:none; padding:6px 0; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text-faint);
  }
  .bottom-tab-btn.active { color:var(--accent); }
  .bottom-tab-btn span { font-size:10.5px; font-weight:500; }

  .conv-header {
    display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--border);
    background:var(--glass); backdrop-filter:blur(14px); flex-shrink:0;
  }
  .msg-scroll { flex:1; overflow-y:auto; padding:18px 6% 12px; display:flex; flex-direction:column; gap:2px; }

  .msg-row { display:flex; margin-bottom:10px; }
  .msg-row.me { justify-content:flex-end; }
  .msg-row.them { justify-content:flex-start; }
  .msg-stack { display:flex; gap:8px; max-width:72%; }
  .msg-row.me .msg-stack { flex-direction:row-reverse; }

  .bubble { border-radius:16px 16px 4px 16px; box-shadow:var(--shadow); position:relative; }
  .msg-row.them .bubble { border-radius:16px 16px 16px 4px; }
  .bubble.text { padding:9px 13px; background:var(--bubble-them); color:var(--text); }
  .msg-row.me .bubble.text { background:var(--bubble-me); color:#fff; }
  .bubble.media { padding:6px; background:var(--bubble-them); }
  .msg-row.me .bubble.media { background:var(--bubble-me); }
  .bubble.file, .bubble.audio { padding:10px 12px; background:var(--bubble-them); color:var(--text); }
  .msg-row.me .bubble.file, .msg-row.me .bubble.audio { background:var(--bubble-me); color:#fff; }

  .msg-meta { display:flex; align-items:center; justify-content:flex-end; gap:4px; margin-top:4px; font-size:10.5px; opacity:.7; }
  .msg-row.me .msg-meta { opacity:.85; }

  .typing-indicator { align-self:flex-start; display:flex; align-items:center; gap:8px; margin-top:8px; }
  .typing-bubble { background:var(--bubble-them); border-radius:16px 16px 16px 4px; padding:10px 14px; display:flex; gap:4px; }
  .typing-bubble span { width:6px; height:6px; border-radius:9999px; background:var(--text-dim); display:inline-block; }

  .input-bar { position:relative; border-top:1px solid var(--border); background:var(--glass); backdrop-filter:blur(14px); padding:12px 16px; flex-shrink:0; }
  .compose-pill { flex:1; display:flex; align-items:center; background:var(--surface-2); border-radius:22px; border:1px solid var(--border); padding:4px 6px 4px 14px; }
  #compose-input { flex:1; background:none; border:none; color:var(--text); font-size:14px; padding:8px 10px; }
  .send-btn, .mic-btn {
    width:44px; height:44px; border-radius:9999px; border:none; cursor:pointer; display:flex; align-items:center;
    justify-content:center; flex-shrink:0;
  }
  .send-btn { background:var(--bubble-me); color:#fff; }
  .mic-btn { background:var(--surface-2); color:var(--text-dim); }

  .popover {
    position:absolute; bottom:100%; margin-bottom:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:12px; box-shadow:var(--shadow); z-index:20;
  }
  .emoji-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; width:260px; }
  .emoji-grid button { font-size:20px; background:none; border:none; padding:6px; border-radius:8px; }
  .emoji-grid button:hover { background:var(--surface-2); }
  .attach-menu { left:56px; padding:8px; display:flex; flex-direction:column; gap:2px; width:200px; }
  .attach-opt { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; background:none; border:none; color:var(--text); font-size:13.5px; text-align:left; }
  .attach-opt:hover { background:var(--surface-2); }
  .attach-icon-wrap { width:30px; height:30px; border-radius:9999px; display:flex; align-items:center; justify-content:center; }

  .info-drawer {
    position:absolute; top:0; right:0; bottom:0; width:340px; background:var(--surface); border-left:1px solid var(--border);
    overflow-y:auto; z-index:10; box-shadow:-8px 0 24px rgba(0,0,0,0.2); height:100%;
  }
  .settings-row { display:flex; align-items:center; gap:14px; padding:13px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
  .toggle-switch { width:40px; height:24px; border-radius:9999px; border:none; cursor:pointer; position:relative; flex-shrink:0; transition:background .2s; }
  .toggle-knob { width:18px; height:18px; border-radius:9999px; background:#fff; position:absolute; top:3px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }

  .waveform { display:flex; align-items:center; gap:2px; height:24px; }
  .wave-bar { width:3px; border-radius:2px; transition:background .15s; }

  /* ---------- CALLS ---------- */
  .call-banner {
    display:flex; align-items:center; gap:12px; padding:14px; border-radius:16px; margin-bottom:16px;
    background:var(--surface-2); border:1px solid var(--border);
  }
  .call-banner-btn {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 8px; border-radius:12px;
    border:none; background:var(--surface-3); color:var(--text); font-size:12px; font-weight:600;
  }
  .call-banner-btn i { color:var(--accent); }
  .join-call-row { display:flex; gap:8px; margin-top:12px; }
  .join-call-row input { flex:1; }
  .call-overlay {
    position:fixed; inset:0; z-index:200; background:radial-gradient(circle at 50% 20%, #1D2230, #05060A 75%);
    display:flex; flex-direction:column; color:#fff;
  }
  .call-topbar { position:absolute; top:0; left:0; right:0; padding:20px; display:flex; flex-direction:column; align-items:center; gap:4px; z-index:3; }
  .call-remote-area { flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
  #remote-video { width:100%; height:100%; object-fit:cover; display:none; }
  .call-remote-avatar { display:flex; flex-direction:column; align-items:center; gap:14px; }
  #local-video {
    position:absolute; bottom:120px; right:18px; width:110px; height:150px; object-fit:cover; border-radius:16px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5); border:1.5px solid rgba(255,255,255,0.18); background:#000; z-index:3;
    transform:scaleX(-1);
  }
  .call-code-panel {
    display:flex; flex-direction:column; align-items:center; gap:8px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:16px 20px; margin:0 24px;
  }
  .call-code-value { font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:600; letter-spacing:3px; color:var(--accent-2); }
  .call-controls { display:flex; align-items:center; justify-content:center; gap:18px; padding:28px 0 40px; z-index:3; }
  .call-ctrl-btn {
    width:56px; height:56px; border-radius:9999px; border:none; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.12); color:#fff;
  }
  .call-ctrl-btn.off { background:#fff; color:#111; }
  .call-end-btn { width:64px; height:64px; border-radius:9999px; border:none; background:var(--danger); color:#fff; display:flex; align-items:center; justify-content:center; }

  @media (max-width: 860px) {
    #rail { display:none; }
    #list-panel { width:100%; }
  }
</style>
</head>
<body>

<!-- ============================= ONBOARDING ============================= -->
<div id="onboarding-screen"></div>

<!-- ============================= MAIN APP ============================= -->
<div id="app-root">
  <div id="rail"></div>
  <div id="list-panel"></div>
  <div id="conv-panel"></div>
</div>

<script type="module">
/* =====================================================================
   FIREBASE SETUP
   Replace this config with your own project's config from:
   Firebase Console → Project settings → General → Your apps → SDK setup
   Also enable: Authentication → Sign-in method → Email/Password,
   and Firestore Database (any mode) for storing name/avatar color.
===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, sendPasswordResetEmail, updateProfile, signOut,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, updateDoc, deleteDoc, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA1j7J1huN4LN3yUhbn3pGvR3WdTFKRldM",
  authDomain: "chat-bb77d.firebaseapp.com",
  projectId: "chat-bb77d",
  storageBucket: "chat-bb77d.firebasestorage.app",
  messagingSenderId: "146079505223",
  appId: "1:146079505223:web:d0a2a9ba1b16b18f284a62",
  measurementId: "G-0YFZFLQZ77",
};

const firebaseConfigured = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";
let fbApp, auth, db;
if (firebaseConfigured) {
  fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  db = getFirestore(fbApp);
}

function friendlyAuthError(err){
  const code = err && err.code ? err.code : '';
  const map = {
    'auth/email-already-in-use': 'An account with this email already exists. Try signing in instead.',
    'auth/invalid-email': 'Enter a valid email address.',
    'auth/weak-password': 'Password is too weak. Please meet the requirements below.',
    'auth/user-not-found': 'No account found for this email. Try signing up instead.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/invalid-login-credentials': 'Incorrect email or password.',
    'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
    'auth/network-request-failed': 'Network error. Check your connection and try again.',
    'auth/user-disabled': 'This account has been disabled.',
  };
  return map[code] || (err && err.message ? err.message.replace(/^Firebase:\s*/,'') : 'Something went wrong. Please try again.');
}

/* =====================================================================

===================================================================== */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initialsOf(name){ return name ? name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() : '?'; }
function icons(){ if (window.lucide) lucide.createIcons(); }
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

function passwordChecks(pw){
  return {
    length: pw.length >= 8,
    upper: /[A-Z]/.test(pw),
    lower: /[a-z]/.test(pw),
    number: /[0-9]/.test(pw),
    special: /[^A-Za-z0-9]/.test(pw),
  };
}
function isStrongPassword(pw){
  const c = passwordChecks(pw);
  return c.length && c.upper && c.lower && c.number && c.special;
}
function passwordChecklistHtml(pw){
  const c = passwordChecks(pw);
  const items = [
    [c.length, 'At least 8 characters'],
    [c.upper, 'One uppercase letter'],
    [c.lower, 'One lowercase letter'],
    [c.number, 'One number'],
    [c.special, 'One special character (e.g. ! @ # $)'],
  ];
  return `<div class="pw-checklist">${items.map(([met,label]) => `
    <div class="pw-check-item ${met?'met':''}">
      <i data-lucide="${met?'check-circle-2':'circle'}"></i><span>${label}</span>
    </div>`).join('')}</div>`;
}

function colorFromString(str){
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  return PALETTE[Math.abs(hash) % PALETTE.length];
}

function avatarHtml({ name, avatar, color, size=44, online=false, ring=null }) {
  const initials = avatar || initialsOf(name);
  const dotSize = Math.round(size*0.26);
  let ringHtml = '';
  if (ring) {
    ringHtml = `<div class="ring-wrap shimmer-ring" style="inset:-3px;background:${ring};width:${size+6}px;height:${size+6}px;">
      <div style="width:100%;height:100%;border-radius:9999px;background:var(--surface);"></div>
    </div>`;
  }
  return `<div class="avatar-wrap" style="width:${size}px;height:${size}px;">
    ${ringHtml}
    <div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px;background:linear-gradient(135deg, ${color}, ${color}99);">${esc(initials)}</div>
    ${online ? `<span class="avatar-online-dot breathe" style="width:${dotSize}px;height:${dotSize}px;"></span>` : ''}
  </div>`;
}

function ticksHtml(status){
  if (status === 'sent') return `<i data-lucide="check" style="width:14px;height:14px;color:rgba(255,255,255,.85)"></i>`;
  if (status === 'delivered') return `<i data-lucide="check-check" style="width:14px;height:14px;color:rgba(255,255,255,.85)"></i>`;
  if (status === 'read') return `<i data-lucide="check-check" style="width:14px;height:14px;color:#4FC3F7"></i>`;
  return '';
}

function waveformHtml(bars, msgId, progress=0){
  const total = bars.length;
  return `<div class="waveform" id="wave-${msgId}">${bars.map((h,i)=>{
    const active = i/total <= progress;
    return `<div class="wave-bar" data-idx="${i}" style="height:${Math.max(4,h)}px;background:${active?'var(--wave-active,#fff)':'var(--wave-dim,rgba(255,255,255,.35))'};"></div>`;
  }).join('')}</div>`;
}

function fmtClock(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

function enterApp(){

  document.getElementById('app-root').classList.add('active');
  renderApp();
}

async function loadProfileColor(uid){
  try {
    const snap = await getDoc(doc(db, 'users', uid));
    return snap.exists() ? (snap.data().color || null) : null;
  } catch (e) {
    return null;
  }
}

async function submitAuth(){
  const email = document.getElementById('email-input').value.trim();
  const password = document.getElementById('password-input').value;
  emailDraft = email;
  passwordDraft = password;

  if (!isValidEmail(email)) {
    onboardError = 'Enter a valid email address.';
    renderOnboarding();
    return;
  }

  if (authMode === 'signup') {
    if (!isStrongPassword(password)) {
      onboardError = 'Your password doesn\u2019t meet the requirements below yet.';
      renderOnboarding();
      return;
    }
    onboardError = ''; onboardSuccess = ''; authLoading = true; renderOnboarding();
    try {
      await createUserWithEmailAndPassword(auth, email, password);
      authLoading = false;
      onboardStep = 'profile';
      renderOnboarding();
    } catch (err) {
      authLoading = false;
      onboardError = friendlyAuthError(err);
      renderOnboarding();
    }
  } else {
    if (password.length === 0) {
      onboardError = 'Enter your password.';
      renderOnboarding();
      return;
    }
    onboardError = ''; onboardSuccess = ''; authLoading = true; renderOnboarding();
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const user = cred.user;
      if (!user.displayName) {
        // Account exists in Firebase Auth but never finished profile setup
        authLoading = false;
        onboardStep = 'profile';
        renderOnboarding();
        return;
      }
      const color = (await loadProfileColor(user.uid)) || colorFromString(user.email);
      authLoading = false;
      account = { email: user.email, name: user.displayName, color, initials: initialsOf(user.displayName) };
      enterApp();
    } catch (err) {
      authLoading = false;
      onboardError = friendlyAuthError(err);
      renderOnboarding();
    }
  }
}

async function finishProfile(){
  const name = document.getElementById('name-input').value.trim();
  if (!name) {
    onboardError = 'Please enter your name.';
    renderOnboarding();
    return;
  }
  onboardError = ''; authLoading = true; renderOnboarding();
  try {
    const user = auth.currentUser;
    if (!user) throw new Error('Your session expired. Please sign in again.');
    await updateProfile(user, { displayName: name });
    await setDoc(doc(db, 'users', user.uid), { name, color: profileColorDraft }, { merge: true });
    authLoading = false;
    account = { email: user.email, name, color: profileColorDraft, initials: initialsOf(name) };
    enterApp();
  } catch (err) {
    authLoading = false;
    onboardError = friendlyAuthError(err);
    renderOnboarding();
  }
}

function goToForgotPassword(){
  onboardError = '';
  onboardSuccess = '';
  resetEmail = emailDraft;
  onboardStep = 'forgot-request';
  renderOnboarding();
}

function backToSignIn(){
  onboardError = '';
  onboardSuccess = '';
  authMode = 'signin';
  onboardStep = 'auth';
  renderOnboarding();
}

async function submitForgotRequest(){
  const email = document.getElementById('forgot-email-input').value.trim();
  if (!isValidEmail(email)) {
    onboardError = 'Enter a valid email address.';
    renderOnboarding();
    return;
  }
  onboardError = ''; authLoading = true; renderOnboarding();
  resetEmail = email;
  try {
    await sendPasswordResetEmail(auth, email);
  } catch (err) {
    // Don't reveal whether the account exists, except for a malformed email
    if (err && err.code === 'auth/invalid-email') {
      authLoading = false;
      onboardError = 'Enter a valid email address.';
      renderOnboarding();
      return;
    }
  }
  authLoading = false;
  onboardStep = 'forgot-sent';
  renderOnboarding();
}

  scroll.scrollTop = scroll.scrollHeight;

function messageBubbleHtml(msg, contact, showAvatar){
  const isMe = msg.sender === 'me';
  const isGroup = contact.group;
  let inner = '';

  if (msg.type === 'text') {
    inner = `<div class="bubble text"><div style="font-size:14px;line-height:1.45;word-break:break-word;">${esc(msg.content)}</div>${metaHtml(msg,isMe)}</div>`;
  } else if (msg.type === 'image') {
    inner = `<div class="bubble media">
      <img src="${esc(msg.content)}" alt="shared" style="width:100%;max-width:260px;border-radius:12px;display:block;" />
      ${msg.caption ? `<div style="font-size:13px;padding:6px 6px 2px;color:${isMe?'#fff':'var(--text)'};">${esc(msg.caption)}</div>` : ''}
      <div style="padding:${msg.caption?'0 4px 2px':'4px'};">${metaHtml(msg,isMe,true)}</div>
    </div>`;
  } else if (msg.type === 'file') {
    inner = `<div class="bubble file">
      <div style="display:flex;align-items:center;gap:10px;min-width:200px;">
        <div style="width:38px;height:38px;border-radius:10px;background:${isMe?'rgba(255,255,255,0.18)':'var(--accent-soft)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i data-lucide="file" style="width:18px;height:18px;color:${isMe?'#fff':'var(--accent)'};"></i>
        </div>
        <div style="min-width:0;">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(msg.fileName)}</div>
          <div style="font-size:11px;opacity:0.75;">${esc(msg.fileSize)}</div>
        </div>
      </div>
      ${metaHtml(msg,isMe)}
    </div>`;
  } else if (msg.type === 'audio') {
    const state = audioPlaying[msg.id] || { playing:false, progress:0 };
    inner = `<div class="bubble audio">
      <div style="display:flex;align-items:center;gap:10px;min-width:190px;" id="audio-row-${msg.id}">
        <button data-action="play-audio" data-id="${msg.id}" style="width:32px;height:32px;border-radius:9999px;border:none;cursor:pointer;flex-shrink:0;background:${isMe?'rgba(255,255,255,0.22)':'var(--accent)'};color:#fff;display:flex;align-items:center;justify-content:center;">
          <i data-lucide="${state.playing?'pause':'play'}" style="width:14px;height:14px;${state.playing?'':'margin-left:1px;'}"></i>
        </button>
        <div style="--wave-active:${isMe?'#fff':'var(--accent)'};--wave-dim:${isMe?'rgba(255,255,255,.35)':'var(--surface-3)'};">
          ${waveformHtml(msg.wave, msg.id, state.progress)}
        </div>
        <span class="font-mono" style="font-size:10.5px;opacity:0.75;flex-shrink:0;">0:${String(msg.duration).padStart(2,'0')}</span>
      </div>
      ${metaHtml(msg,isMe)}
    </div>`;
  }

  const whoLabel = (!isMe && isGroup && msg.who && showAvatar) ? `<div class="font-display" style="font-size:11.5px;font-weight:600;color:${msg.color};margin-bottom:2px;margin-left:4px;">${esc(msg.who)}</div>` : '';
  const avatarSlot = (!isMe && isGroup) ? `<div style="width:28px;flex-shrink:0;">${showAvatar ? avatarHtml({ name:msg.who, color:msg.color, size:28 }) : ''}</div>` : '';

  return `<div class="msg-row ${isMe?'me':'them'}">
    <div class="msg-stack">
      ${avatarSlot}
      <div>${whoLabel}${inner}</div>
    </div>

function toggleAudioPlay(msgId){
  const msgs = messagesByChat[selectedId] || [];
  const msg = msgs.find(m => m.id === msgId);
  if (!msg) return;
  const state = audioPlaying[msgId] || { playing:false, progress:0, interval:null };

  if (state.playing) {
    clearInterval(state.interval);
    state.playing = false;
    audioPlaying[msgId] = state;
    renderMessages();
    return;
  }

  state.playing = true;
  const total = msg.duration * 10;
  let tick = Math.round(state.progress * total);
  state.interval = setInterval(() => {
    tick += 1;
    state.progress = tick / total;
    updateWaveformDom(msgId, state.progress);
    const btn = document.querySelector(`#audio-row-${msgId} [data-action="play-audio"] i`);
    if (tick >= total) {
      clearInterval(state.interval);
      state.playing = false;
      state.progress = 0;
      audioPlaying[msgId] = state;
      renderMessages();
    }
  }, 100);
  audioPlaying[msgId] = state;
  renderMessages();
}

function updateWaveformDom(msgId, progress){
  const wave = document.getElementById(`wave-${msgId}`);
  if (!wave) return;
  const bars = wave.querySelectorAll('.wave-bar');
  bars.forEach((b,i) => {
    const active = i/bars.length <= progress;
    b.style.background = active ? 'var(--wave-active)' : 'var(--wave-dim)';
  });
}

/* =====================================================================
   REAL AUDIO / VIDEO CALLS (WebRTC, signaled through Firestore)
   Two browsers/devices signed into ChatWave connect peer-to-peer:
   one starts a call and gets a 6-character code, the other joins with it.
   Media (audio/video) flows directly between devices — Firestore is only
   used to exchange the connection handshake (SDP offer/answer + ICE candidates).
===================================================================== */
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
];

function genCallCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function callOverlayHtml(type, role, code, peerLabel){
  return `
  <div id="call-overlay" class="call-overlay fade-up">
    <div class="call-topbar">
      <div id="call-status-text" style="font-size:14px;font-weight:600;">${role==='caller' ? 'Starting call…' : 'Joining call…'}</div>
      <div id="call-timer" class="font-mono" style="font-size:12.5px;color:rgba(255,255,255,0.6);"></div>
    </div>
    <div class="call-remote-area">
      <video id="remote-video" autoplay playsinline></video>
      <div id="call-remote-avatar" class="call-remote-avatar">
        ${avatarHtml({ name: peerLabel || '?', color:'#7C5CFF', size:110 })}
        <div class="font-display" style="font-size:17px;font-weight:600;">${esc(peerLabel || 'Waiting for someone to join…')}</div>
      </div>
      ${type==='video' ? `<video id="local-video" autoplay playsinline muted></video>` : ''}
    </div>
    <div id="call-code-panel" class="call-code-panel" style="align-self:center;margin-bottom:18px;${role==='callee'?'display:none;':''}">
      <span style="font-size:12px;color:rgba(255,255,255,0.65);">Share this code so the other person can join</span>
      <div class="call-code-value" id="call-code-value">${esc(code)}</div>
      <button class="ghost-btn" data-action="copy-call-code" style="color:var(--accent-2);">
        <i data-lucide="copy" style="width:13px;height:13px;display:inline;vertical-align:-2px;margin-right:4px;"></i>Copy code
      </button>
    </div>
    <div class="call-controls">
      <button class="call-ctrl-btn" id="btn-call-mute" data-action="toggle-call-mute"><i data-lucide="mic" style="width:22px;height:22px;"></i></button>
      ${type==='video' ? `<button class="call-ctrl-btn" id="btn-call-camera" data-action="toggle-call-camera"><i data-lucide="video" style="width:22px;height:22px;"></i></button>` : ''}
      <button class="call-end-btn" data-action="end-call"><i data-lucide="phone-off" style="width:24px;height:24px;"></i></button>
    </div>
  </div>`;
}

function setCallStatus(text){
  const el = document.getElementById('call-status-text');
  if (el) el.textContent = text;
}
function hideCallCode(){
  const el = document.getElementById('call-code-panel');
  if (el) el.style.display = 'none';
}
function startCallTimer(){
  if (!activeCall) return;
  activeCall.startTime = Date.now();
  activeCall.timerInterval = setInterval(() => {
    const el = document.getElementById('call-timer');
    if (!el || !activeCall) return;
    el.textContent = fmtClock(Math.floor((Date.now() - activeCall.startTime) / 1000));
  }, 1000);
}
function handleRemoteTrack(e){
  if (!activeCall) return;
  activeCall.remoteStream = e.streams[0];
  if (activeCall.type === 'video') {
    const rv = document.getElementById('remote-video');
    const av = document.getElementById('call-remote-avatar');
    if (rv) { rv.srcObject = e.streams[0]; rv.style.display = 'block'; }
    if (av) av.style.display = 'none';
  }
  setCallStatus('Connected');
  hideCallCode();
  if (!activeCall.timerInterval) startCallTimer();
}

async function startCall(type, peerLabel){
  if (!firebaseConfigured) { window.alert('Connect Firebase first to make calls — see the setup screen.'); return; }
  if (activeCall) return;
  const code = genCallCode();
  document.body.insertAdjacentHTML('beforeend', callOverlayHtml(type, 'caller', code, peerLabel));
  icons();
  activeCall = { pc:null, localStream:null, remoteStream:null, callId:code, role:'caller', type, unsubs:[], timerInterval:null, startTime:null, muted:false, cameraOff:false, callDocRef:null };

  setCallStatus('Requesting camera & microphone…');
  let localStream;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: type==='video', audio:true });
  } catch (err) {
    setCallStatus('Could not access camera/microphone. Check permissions and try again.');
    return;
  }
  if (!activeCall) { localStream.getTracks().forEach(t=>t.stop()); return; } // call was ended while waiting for permission
  activeCall.localStream = localStream;
  if (type === 'video') {
    const lv = document.getElementById('local-video');
    if (lv) lv.srcObject = localStream;
  }

  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  activeCall.pc = pc;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = handleRemoteTrack;

  const callDocRef = doc(db, 'calls', code);
  activeCall.callDocRef = callDocRef;
  pc.onicecandidate = (e) => {
    if (e.candidate) addDoc(collection(callDocRef, 'callerCandidates'), e.candidate.toJSON()).catch(()=>{});
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await setDoc(callDocRef, {
    offer: { type: offer.type, sdp: offer.sdp },
    type, status: 'ringing',
    callerEmail: account.email, callerName: account.name,
    createdAt: serverTimestamp(),
  });
  setCallStatus('Waiting for the other person to join…');

  const unsub1 = onSnapshot(callDocRef, async (snap) => {
    const data = snap.data();
    if (data && data.answer && pc.currentRemoteDescription == null) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      setCallStatus('Connected');
      hideCallCode();
    }
  });
  const unsub2 = onSnapshot(collection(callDocRef, 'calleeCandidates'), (snap) => {
    snap.docChanges().forEach(change => {
      if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data())).catch(()=>{});
    });
  });
  activeCall.unsubs.push(unsub1, unsub2);
}

async function joinCallByCode(codeRaw){
  const code = (codeRaw || '').trim().toUpperCase();
  joinCallError = '';
  if (!code) { joinCallError = 'Enter a call code first.'; renderListPanel(); icons(); return; }
  if (!firebaseConfigured) { window.alert('Connect Firebase first to join calls — see the setup screen.'); return; }
  if (activeCall) return;

  const callDocRef = doc(db, 'calls', code);
  let snap;
  try {
    snap = await getDoc(callDocRef);
  } catch (e) {
    joinCallError = 'Could not reach the call. Check your connection.';
    renderListPanel(); icons();
    return;
  }
  if (!snap.exists()) { joinCallError = 'No call found with that code.'; renderListPanel(); icons(); return; }
  const data = snap.data();
  if (data.answer) { joinCallError = 'This call has already connected.'; renderListPanel(); icons(); return; }

  joinCallError = '';
  const type = data.type || 'video';
  document.body.insertAdjacentHTML('beforeend', callOverlayHtml(type, 'callee', code, data.callerName || 'Unknown caller'));
  icons();
  activeCall = { pc:null, localStream:null, remoteStream:null, callId:code, role:'callee', type, unsubs:[], timerInterval:null, startTime:null, muted:false, cameraOff:false, callDocRef };

  setCallStatus('Requesting camera & microphone…');
  let localStream;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: type==='video', audio:true });
  } catch (err) {
    setCallStatus('Could not access camera/microphone. Check permissions and try again.');
    return;
  }
  if (!activeCall) { localStream.getTracks().forEach(t=>t.stop()); return; }
  activeCall.localStream = localStream;
  if (type === 'video') {
    const lv = document.getElementById('local-video');
    if (lv) lv.srcObject = localStream;
  }

  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  activeCall.pc = pc;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = handleRemoteTrack;
  pc.onicecandidate = (e) => {
    if (e.candidate) addDoc(collection(callDocRef, 'calleeCandidates'), e.candidate.toJSON()).catch(()=>{});
  };

  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await updateDoc(callDocRef, { answer: { type: answer.type, sdp: answer.sdp }, status: 'connected' });
  setCallStatus('Connecting…');

  const unsub = onSnapshot(collection(callDocRef, 'callerCandidates'), (snap2) => {
    snap2.docChanges().forEach(change => {
      if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data())).catch(()=>{});
    });
  });
  activeCall.unsubs.push(unsub);
}

function endCall(){
  if (!activeCall) return;
  const { pc, localStream, unsubs, timerInterval, callDocRef } = activeCall;
  if (timerInterval) clearInterval(timerInterval);
  unsubs.forEach(u => { try { u(); } catch(e){} });
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) pc.close();
  if (callDocRef) updateDoc(callDocRef, { status: 'ended' }).catch(()=>{});
  const overlay = document.getElementById('call-overlay');
  if (overlay) overlay.remove();
  activeCall = null;
}

function toggleCallMute(){
  if (!activeCall || !activeCall.localStream) return;
  activeCall.muted = !activeCall.muted;
  activeCall.localStream.getAudioTracks().forEach(t => t.enabled = !activeCall.muted);
  const btn = document.getElementById('btn-call-mute');
  if (btn) {
    btn.classList.toggle('off', activeCall.muted);
    btn.innerHTML = `<i data-lucide="${activeCall.muted?'mic-off':'mic'}" style="width:22px;height:22px;"></i>`;
    icons();
  }
}
function toggleCallCamera(){
  if (!activeCall || !activeCall.localStream) return;
  activeCall.cameraOff = !activeCall.cameraOff;
  activeCall.localStream.getVideoTracks().forEach(t => t.enabled = !activeCall.cameraOff);
  const btn = document.getElementById('btn-call-camera');
  if (btn) {
    btn.classList.toggle('off', activeCall.cameraOff);
    btn.innerHTML = `<i data-lucide="${activeCall.cameraOff?'video-off':'video'}" style="width:22px;height:22px;"></i>`;
    icons();
  }
}
function copyCallCode(){
  if (!activeCall) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(activeCall.callId).catch(()=>{});
  }
  const btn = document.querySelector('[data-action="copy-call-code"]');
  if (btn) {
    const orig = btn.innerHTML;
    btn.textContent = 'Copied!';
    setTimeout(() => { if (document.body.contains(btn)) btn.innerHTML = orig; }, 1200);
  }
}

/* =====================================================================
   EVENT DELEGATION
===================================================================== */
document.addEventListener('click', (e) => {
  // onboarding buttons
  if (e.target.closest('#btn-submit-auth')) return submitAuth();
  if (e.target.closest('#btn-finish-profile')) return finishProfile();
  if (e.target.closest('#btn-forgot-request')) return submitForgotRequest();
  if (e.target.closest('[data-action="toggle-password"]')) return togglePasswordVisibility();
  if (e.target.closest('[data-action="go-forgot"]')) return goToForgotPassword();
  if (e.target.closest('[data-action="back-to-signin"]')) return backToSignIn();
  const modeBtn = e.target.closest('[data-action="set-mode"]');
  if (modeBtn) { return setAuthMode(modeBtn.dataset.mode); }
  const colorChoice = e.target.closest('.color-choice');
  if (colorChoice) { profileColorDraft = colorChoice.dataset.color; renderOnboarding(); return; }

  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  switch(action){
    case 'switch-tab': switchTab(target.dataset.tab); break;
    case 'select-chat': selectChat(Number(id)); break;
    case 'back-mobile': goBackMobile(); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'toggle-info': toggleInfo(); break;
    case 'toggle-mute': toggleMute(Number(id)); break;
    case 'toggle-emoji': toggleEmoji(); break;
    case 'toggle-attach': toggleAttach(); break;
    case 'insert-emoji': insertEmoji(target.dataset.emoji); break;
    case 'attach-image': addImageMessage(); break;
    case 'attach-file': addFileMessage(); break;
    case 'send': handleSend(); break;
    case 'record-start': startRecording(); break;
    case 'cancel-record': stopRecording(false); break;
    case 'send-record': stopRecording(true); break;
    case 'toggle-notif': settingsState.notif = !settingsState.notif; renderListPanel(); icons(); break;
    case 'toggle-receipts': settingsState.readReceipts = !settingsState.readReceipts; renderListPanel(); icons(); break;
    case 'log-out': logOut(); break;
    case 'start-video-call': startCall('video', target.dataset.name || null); break;
    case 'start-audio-call': startCall('audio', target.dataset.name || null); break;
    case 'join-call': {
      const jci = document.getElementById('join-call-input');
      joinCallByCode(jci ? jci.value : '');
      break;
    }
    case 'toggle-call-mute': toggleCallMute(); break;
    case 'toggle-call-camera': toggleCallCamera(); break;
    case 'end-call': endCall(); break;
    case 'copy-call-code': copyCallCode(); break;
    default:
      if (action && action.startsWith('toggle-mute-')) toggleMute(Number(action.replace('toggle-mute-','')));
  }
});

function logOut(){
  if (activeCall) endCall();
  const cleanup = () => {
    account = null;
    onboardStep = 'auth';
    authMode = 'signin';
    emailDraft = '';
    passwordDraft = '';
    showPassword = false;
    profileNameDraft = '';
    onboardError = '';
    onboardSuccess = '';
    authLoading = false;
    resetEmail = '';
    document.getElementById('app-root').classList.remove('active');
    document.getElementById('onboarding-screen').style.display = 'flex';
    renderOnboarding();
  };
  if (auth) {
    signOut(auth).catch(() => {}).then(cleanup);
  } else {
    cleanup();
  }
}

document.addEventListener('input', (e) => {
  if (e.target.id === 'name-input') {
    profileNameDraft = e.target.value;
    const avatarSlot = document.querySelector('.onboard-card > div[style*="justify-content:center"]');
    if (avatarSlot) avatarSlot.innerHTML = avatarHtml({ name: profileNameDraft || '?', color: profileColorDraft, size:84 });
    document.querySelectorAll('.color-choice').forEach(el => {
      el.textContent = profileNameDraft ? initialsOf(profileNameDraft) : '';
    });
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.target.id === 'email-input' || e.target.id === 'password-input')) {
    submitAuth();
  }
  if (e.key === 'Enter' && e.target.id === 'forgot-email-input') {
    submitForgotRequest();
  }
});

window.addEventListener('resize', () => {
  const nowMobile = window.innerWidth < 860;
  if (nowMobile !== isMobile) {
    isMobile = nowMobile;
    if (!isMobile) mobileView = 'chat';
    if (account) renderApp();
  }
});

/* =====================================================================
   INIT
===================================================================== */
if (firebaseConfigured) {
  onAuthStateChanged(auth, async (user) => {
    if (user && !account) {
      if (!user.displayName) {
        // Signed in but never finished profile setup (e.g. refreshed mid-onboarding)
        emailDraft = user.email;
        onboardStep = 'profile';
        renderOnboarding();
        return;
      }
      const color = (await loadProfileColor(user.uid)) || colorFromString(user.email);
      account = { email: user.email, name: user.displayName, color, initials: initialsOf(user.displayName) };
      enterApp();
    } else if (!user && account) {
      account = null;
    }
  });
}
renderOnboarding();
icons();
</script>
</body>
</html>
