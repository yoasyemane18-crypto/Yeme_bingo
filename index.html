<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatWave</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root[data-theme="dark"] {
    --bg:#0A0C12; --surface:#12151D; --surface-2:#171B26; --surface-3:#1D2230;
    --glass:rgba(18,21,29,0.72); --border:rgba(255,255,255,0.07); --border-strong:rgba(255,255,255,0.14);
    --text:#F1F2F6; --text-dim:#8B90A3; --text-faint:#565B70;
    --accent:#7C5CFF; --accent-2:#2DD4BF; --accent-soft:rgba(124,92,255,0.14);
    --online:#34D399; --danger:#FB7185; --warn:#F59E0B;
    --bubble-me:linear-gradient(135deg,#7C5CFF 0%,#5B79EF 100%); --bubble-them:#1B1F2B;
    --shadow:0 12px 32px rgba(0,0,0,0.45); --on-accent:#fff;
  }
  :root[data-theme="light"] {
    --bg:#EFEFF4; --surface:#FFFFFF; --surface-2:#F6F6FA; --surface-3:#ECECF3;
    --glass:rgba(255,255,255,0.75); --border:rgba(10,12,18,0.08); --border-strong:rgba(10,12,18,0.14);
    --text:#14161C; --text-dim:#666B80; --text-faint:#9A9EB0;
    --accent:#6C4CFF; --accent-2:#0FA898; --accent-soft:rgba(108,76,255,0.10);
    --online:#0EA371; --danger:#E11D48; --warn:#D97706;
    --bubble-me:linear-gradient(135deg,#6C4CFF 0%,#4C6FEF 100%); --bubble-them:#F0F0F6;
    --shadow:0 12px 32px rgba(20,22,28,0.10); --on-accent:#fff;
  }

  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .font-display { font-family:'Space Grotesk',sans-serif; }
  .font-mono { font-family:'JetBrains Mono',monospace; }
  button { font-family:inherit; cursor:pointer; }
  input { font-family:inherit; }
  img { -webkit-user-drag:none; user-select:none; }

  .no-scrollbar::-webkit-scrollbar { width:6px; height:6px; }
  .no-scrollbar::-webkit-scrollbar-thumb { background:rgba(140,140,160,0.25); border-radius:8px; }
  .no-scrollbar::-webkit-scrollbar-track { background:transparent; }

  @keyframes breathe { 0%,100%{ box-shadow:0 0 0 0 rgba(52,211,153,.55);} 50%{ box-shadow:0 0 0 5px rgba(52,211,153,0);} }
  .breathe { animation:breathe 2.2s ease-in-out infinite; }
  @keyframes rise { from{opacity:0;transform:translateY(10px) scale(.98);} to{opacity:1;transform:translateY(0) scale(1);} }
  .rise { animation:rise .28s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes popIn { from{opacity:0;transform:scale(.85);} to{opacity:1;transform:scale(1);} }
  .popIn { animation:popIn .2s ease-out both; }
  @keyframes shimmerRing { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
  .shimmer-ring { animation:shimmerRing 3.5s linear infinite; }
  @keyframes bounceDot { 0%,60%,100%{transform:translateY(0);opacity:.4;} 30%{transform:translateY(-4px);opacity:1;} }
  .dot1{animation:bounceDot 1.2s infinite ease-in-out;} .dot2{animation:bounceDot 1.2s infinite ease-in-out .15s;} .dot3{animation:bounceDot 1.2s infinite ease-in-out .3s;}
  @keyframes slideInRight { from{transform:translateX(100%);} to{transform:translateX(0);} }
  .slide-in-right { animation:slideInRight .32s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  .fade-up { animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pulseRec { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .pulse-rec { animation:pulseRec 1s infinite; }
  @keyframes gradShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

  a, button, input { outline:none; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ---------- ONBOARDING ---------- */
  #onboarding-screen {
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
    background-image: radial-gradient(circle at 15% 15%, var(--accent-soft), transparent 45%),
                       radial-gradient(circle at 85% 85%, rgba(45,212,191,0.10), transparent 45%);
  }
  .onboard-card {
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border);
    border-radius:24px; padding:36px 32px; box-shadow:var(--shadow);
  }
  .onboard-logo {
    width:56px; height:56px; border-radius:18px; margin:0 auto 20px;
    background:linear-gradient(135deg,#7C5CFF,#2DD4BF); background-size:200% 200%;
    animation:gradShift 4s ease infinite;
    display:flex; align-items:center; justify-content:center;
  }
  .otp-boxes { display:flex; gap:10px; justify-content:center; margin:22px 0 6px; }
  .otp-box {
    width:46px; height:54px; border-radius:12px; border:1.5px solid var(--border-strong);
    background:var(--surface-2); color:var(--text); font-size:20px; text-align:center;
    font-family:'JetBrains Mono',monospace; font-weight:500; transition:border-color .15s, box-shadow .15s;
  }
  .otp-box:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .field-input {
    width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid var(--border-strong);
    background:var(--surface-2); color:var(--text); font-size:14.5px; transition:border-color .15s, box-shadow .15s;
  }
  .field-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .primary-btn {
    width:100%; padding:13px 14px; border-radius:14px; border:none; background:var(--bubble-me);
    color:#fff; font-weight:600; font-size:14.5px; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s, opacity .15s; box-shadow:0 8px 20px rgba(124,92,255,0.28);
  }
  .primary-btn:hover { transform:translateY(-1px); }
  .primary-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  .ghost-btn {
    background:none; border:none; color:var(--accent); font-weight:600; font-size:13px; padding:8px;
  }
  .avatar-choice {
    width:56px; height:56px; border-radius:9999px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:600; font-family:'Space Grotesk',sans-serif; font-size:18px; cursor:pointer;
    border:2.5px solid transparent; transition:border-color .15s, transform .12s;
  }
  .avatar-choice.selected { border-color:var(--text); transform:scale(1.08); }

  /* ---------- COUNTRY PICKER ---------- */
  .country-select-btn {
    width:120px; flex-shrink:0; display:flex; align-items:center; gap:6px; justify-content:space-between;
  }
  .country-picker-overlay {
    position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .country-picker-card {
    width:100%; max-width:380px; max-height:72vh; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;
  }
  .country-picker-header { padding:16px 16px 10px; border-bottom:1px solid var(--border); }
  .country-picker-list { flex:1; overflow-y:auto; padding:6px 8px; }
  .country-picker-row {
    display:flex; align-items:center; gap:12px; padding:10px 10px; border-radius:12px; cursor:pointer;
  }
  .country-picker-row:hover { background:var(--surface-2); }
  .country-picker-row.selected { background:var(--accent-soft); }

  /* ---------- APP LAYOUT ---------- */
  #app-root { display:none; width:100%; height:100vh; overflow:hidden; }
  #app-root.active { display:flex; }

  #rail {
    width:76px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; padding:20px 0; gap:6px;
  }
  .rail-logo {
    width:42px; height:42px; border-radius:14px; margin-bottom:18px;
    background:linear-gradient(135deg,#7C5CFF,#2DD4BF); display:flex; align-items:center; justify-content:center;
  }
  .rail-btn {
    width:46px; height:46px; border-radius:14px; border:none; cursor:pointer; background:transparent;
    color:var(--text-dim); display:flex; align-items:center; justify-content:center; position:relative;
    transition:all .18s;
  }
  .rail-btn.active { background:var(--accent-soft); color:var(--accent); }
  .rail-badge {
    position:absolute; top:2px; right:2px; background:var(--danger); color:#fff; font-size:9px; font-weight:600;
    border-radius:9999px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  #list-panel { width:380px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100%; }
  #conv-panel { flex:1; display:flex; flex-direction:column; height:100%; min-width:0; position:relative; }

  .icon-btn {
    width:36px; height:36px; border-radius:10px; border:none; background:transparent; color:var(--text-dim);
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s,color .15s;
  }
  .icon-btn:hover { background:var(--surface-2); color:var(--accent); }

  .search-wrap { position:relative; }
  .search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint); pointer-events:none; }
  .search-input {
    width:100%; padding:10px 12px 10px 36px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:13.5px;
  }

  .chat-row {
    display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px; cursor:pointer; margin-bottom:2px;
    transition:background .15s;
  }
  .chat-row:hover { background:var(--surface-2); }
  .chat-row.selected { background:var(--accent-soft); }
  .chat-row.selected:hover { background:var(--accent-soft); }

  .avatar-wrap { position:relative; flex-shrink:0; }
  .avatar {
    border-radius:9999px; display:flex; align-items:center; justify-content:center; color:#fff;
    font-weight:600; font-family:'Space Grotesk',sans-serif; user-select:none; position:relative; z-index:1;
  }
  .avatar-online-dot {
    position:absolute; bottom:1px; right:1px; border-radius:9999px; background:var(--online);
    border:2.5px solid var(--surface); z-index:2;
  }
  .ring-wrap { position:absolute; border-radius:9999px; padding:2px; }
  .ring-wrap .avatar { position:relative; }

  .badge-unread {
    background:var(--accent); color:#fff; font-size:10.5px; font-weight:600; min-width:18px; height:18px;
    border-radius:9999px; display:flex; align-items:center; justify-content:center; padding:0 5px;
  }

  .bottom-tabs { display:flex; border-top:1px solid var(--border); padding:6px 0; }
  .bottom-tab-btn {
    flex:1; background:none; border:none; padding:6px 0; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text-faint);
  }
  .bottom-tab-btn.active { color:var(--accent); }
  .bottom-tab-btn span { font-size:10.5px; font-weight:500; }

  .conv-header {
    display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--border);
    background:var(--glass); backdrop-filter:blur(14px); flex-shrink:0;
  }
  .msg-scroll { flex:1; overflow-y:auto; padding:18px 6% 12px; display:flex; flex-direction:column; gap:2px; }

  .msg-row { display:flex; margin-bottom:10px; }
  .msg-row.me { justify-content:flex-end; }
  .msg-row.them { justify-content:flex-start; }
  .msg-stack { display:flex; gap:8px; max-width:72%; }
  .msg-row.me .msg-stack { flex-direction:row-reverse; }

  .bubble { border-radius:16px 16px 4px 16px; box-shadow:var(--shadow); position:relative; }
  .msg-row.them .bubble { border-radius:16px 16px 16px 4px; }
  .bubble.text { padding:9px 13px; background:var(--bubble-them); color:var(--text); }
  .msg-row.me .bubble.text { background:var(--bubble-me); color:#fff; }
  .bubble.media { padding:6px; background:var(--bubble-them); }
  .msg-row.me .bubble.media { background:var(--bubble-me); }
  .bubble.file, .bubble.audio { padding:10px 12px; background:var(--bubble-them); color:var(--text); }
  .msg-row.me .bubble.file, .msg-row.me .bubble.audio { background:var(--bubble-me); color:#fff; }

  .msg-meta { display:flex; align-items:center; justify-content:flex-end; gap:4px; margin-top:4px; font-size:10.5px; opacity:.7; }
  .msg-row.me .msg-meta { opacity:.85; }

  .typing-indicator { align-self:flex-start; display:flex; align-items:center; gap:8px; margin-top:8px; }
  .typing-bubble { background:var(--bubble-them); border-radius:16px 16px 16px 4px; padding:10px 14px; display:flex; gap:4px; }
  .typing-bubble span { width:6px; height:6px; border-radius:9999px; background:var(--text-dim); display:inline-block; }

  .input-bar { position:relative; border-top:1px solid var(--border); background:var(--glass); backdrop-filter:blur(14px); padding:12px 16px; flex-shrink:0; }
  .compose-pill { flex:1; display:flex; align-items:center; background:var(--surface-2); border-radius:22px; border:1px solid var(--border); padding:4px 6px 4px 14px; }
  #compose-input { flex:1; background:none; border:none; color:var(--text); font-size:14px; padding:8px 10px; }
  .send-btn, .mic-btn {
    width:44px; height:44px; border-radius:9999px; border:none; cursor:pointer; display:flex; align-items:center;
    justify-content:center; flex-shrink:0;
  }
  .send-btn { background:var(--bubble-me); color:#fff; }
  .mic-btn { background:var(--surface-2); color:var(--text-dim); }

  .popover {
    position:absolute; bottom:100%; margin-bottom:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:12px; box-shadow:var(--shadow); z-index:20;
  }
  .emoji-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; width:260px; }
  .emoji-grid button { font-size:20px; background:none; border:none; padding:6px; border-radius:8px; }
  .emoji-grid button:hover { background:var(--surface-2); }
  .attach-menu { left:56px; padding:8px; display:flex; flex-direction:column; gap:2px; width:200px; }
  .attach-opt { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; background:none; border:none; color:var(--text); font-size:13.5px; text-align:left; }
  .attach-opt:hover { background:var(--surface-2); }
  .attach-icon-wrap { width:30px; height:30px; border-radius:9999px; display:flex; align-items:center; justify-content:center; }

  .info-drawer {
    position:absolute; top:0; right:0; bottom:0; width:340px; background:var(--surface); border-left:1px solid var(--border);
    overflow-y:auto; z-index:10; box-shadow:-8px 0 24px rgba(0,0,0,0.2); height:100%;
  }
  .settings-row { display:flex; align-items:center; gap:14px; padding:13px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
  .toggle-switch { width:40px; height:24px; border-radius:9999px; border:none; cursor:pointer; position:relative; flex-shrink:0; transition:background .2s; }
  .toggle-knob { width:18px; height:18px; border-radius:9999px; background:#fff; position:absolute; top:3px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }

  .waveform { display:flex; align-items:center; gap:2px; height:24px; }
  .wave-bar { width:3px; border-radius:2px; transition:background .15s; }

  @media (max-width: 860px) {
    #rail { display:none; }
    #list-panel { width:100%; }
  }
</style>
</head>

<div id="app-root">

  <div id="list-panel"></div>
  <div id="conv-panel"></div>
</div>

   COUNTRY DATA (ISO 3166-1 alpha-2 + calling code). Flags are derived
   from the ISO code at render time via isoToFlag().
===================================================================== */
function isoToFlag(iso){
  return iso.toUpperCase().replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
}

}

function resetRecaptcha(){
  if (recaptchaVerifier) {
    try { recaptchaVerifier.clear(); } catch(e){}
    recaptchaVerifier = null;
  }
}

===================================================================== */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initialsOf(name){ return name ? name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() : '?'; }
function icons(){ if (window.lucide) lucide.createIcons(); }
function countryByIso(iso){ return COUNTRIES.find(c => c[0] === iso) || COUNTRIES.find(c=>c[0]==='US'); }

function avatarHtml({ name, avatar, color, size=44, online=false, ring=null }) {
  const initials = avatar || initialsOf(name);
  const dotSize = Math.round(size*0.26);
  let ringHtml = '';
  if (ring) {
    ringHtml = `<div class="ring-wrap shimmer-ring" style="inset:-3px;background:${ring};width:${size+6}px;height:${size+6}px;">
      <div style="width:100%;height:100%;border-radius:9999px;background:var(--surface);"></div>
    </div>`;
  }
  return `<div class="avatar-wrap" style="width:${size}px;height:${size}px;">
    ${ringHtml}
    <div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px;background:linear-gradient(135deg, ${color}, ${color}99);">${esc(initials)}</div>
    ${online ? `<span class="avatar-online-dot breathe" style="width:${dotSize}px;height:${dotSize}px;"></span>` : ''}
  </div>`;
}

function ticksHtml(status){
  if (status === 'sent') return `<i data-lucide="check" style="width:14px;height:14px;color:rgba(255,255,255,.85)"></i>`;
  if (status === 'delivered') return `<i data-lucide="check-check" style="width:14px;height:14px;color:rgba(255,255,255,.85)"></i>`;
  if (status === 'read') return `<i data-lucide="check-check" style="width:14px;height:14px;color:#4FC3F7"></i>`;
  return '';
}

function waveformHtml(bars, msgId, progress=0){
  const total = bars.length;
  return `<div class="waveform" id="wave-${msgId}">${bars.map((h,i)=>{
    const active = i/total <= progress;
    return `<div class="wave-bar" data-idx="${i}" style="height:${Math.max(4,h)}px;background:${active?'var(--wave-active,#fff)':'var(--wave-dim,rgba(255,255,255,.35))'};"></div>`;
  }).join('')}</div>`;
}

function fmtClock(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

    <div class="country-picker-row ${c[0]===selectedCountry.iso?'selected':''}" data-iso="${c[0]}">
      <span style="font-size:20px;">${isoToFlag(c[0])}</span>

    </div>`).join('') : `<div style="text-align:center;color:var(--text-faint);padding:30px 10px;font-size:13px;">No countries match "${esc(countrySearch)}"</div>`;

      <div class="country-picker-card popIn" id="country-picker-card">

      </div>
    </div>`;
}

async function submitPhone(){
  const raw = document.getElementById('phone-input').value.trim();
  const digits = raw.replace(/[^0-9]/g,'');
  if (digits.length < 7) {
    onboardError = 'Enter a valid phone number.';
    renderOnboarding();
    return;
  }
  phoneDigits = raw;
  onboardError = '';
  const btn = document.getElementById('btn-send-otp');
  const fullNumber = `${selectedCountry.code}${digits}`;

  if (btn) { btn.disabled = true; btn.innerHTML = 'Sending code…'; }
  try {
  resetRecaptcha(); // <-- Add this here so it clears out the old instance first
  const verifier = getRecaptchaVerifier();
  confirmationResult = await firebase.auth().signInWithPhoneNumber(fullNumber, verifier);
  onboardStep = 'otp';
  renderOnboarding();
} catch (err) {
  onboardError = err && err.message ? err.message : 'Failed to send code. Check the number and try again.';
  renderOnboarding();
}
}

async function verifyOtp(){
  const boxes = document.querySelectorAll('.otp-digit');
  const code = Array.from(boxes).map(b => b.value).join('');
  if (code.length < 6) {
    onboardError = 'Enter all 6 digits.';
    renderOnboarding();
    return;
  }
  if (!confirmationResult) {
    onboardError = 'Session expired. Please request a new code.';
    renderOnboarding();
    return;
  }
  const btn = document.getElementById('btn-verify-otp');
  if (btn) { btn.disabled = true; btn.innerHTML = 'Verifying…'; }
  try {
    await confirmationResult.confirm(code);
    onboardError = '';
    onboardStep = 'profile';
    renderOnboarding();
  } catch (err) {
    onboardError = 'Incorrect code. Please try again.';
    renderOnboarding();
  }
}

async function resendOtp(){
  onboardError = '';
  const digits = phoneDigits.replace(/[^0-9]/g,'');
  const fullNumber = `${selectedCountry.code}${digits}`;
  resetRecaptcha();
  try {
    const verifier = getRecaptchaVerifier();
    confirmationResult = await firebase.auth().signInWithPhoneNumber(fullNumber, verifier);
  } catch (err) {
    onboardError = err && err.message ? err.message : 'Failed to resend code.';
  }
  renderOnboarding();
}

function finishProfile(){
  const name = document.getElementById('name-input').value.trim();
  if (!name) {
    onboardError = 'Please enter your name.';
    renderOnboarding();
    return;

  account = { phone: `${selectedCountry.code} ${phoneDigits}`, name, color: profileColorDraft, initials: initialsOf(name) };
  document.getElementById('onboarding-screen').style.display = 'none';
  document.getElementById('app-root').classList.add('active');
  renderApp();
}

function renderListPanel(){
  const panel = document.getElementById('list-panel');
  if (isMobile && mobileView !== 'list') { panel.style.display = 'none'; return; }
  panel.style.display = 'flex';

  let content = '';
  if (activeTab === 'chats') content = chatsPanelHtml();
  else if (activeTab === 'status') content = statusPanelHtml();
  else if (activeTab === 'calls') content = callsPanelHtml();
  else if (activeTab === 'settings') content = settingsPanelHtml();

  panel.innerHTML = content + (isMobile ? bottomTabsHtml() : '');
  icons();

  if (activeTab === 'chats') {
    const si = document.getElementById('chat-search');
    si && si.addEventListener('input', (e) => { search = e.target.value; renderListPanel(); icons(); });
  }
}

function chatsPanelHtml(){
  const filtered = contacts
    .filter(c => c.name.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));

  const rows = filtered.length === 0
    ? `<div style="text-align:center;color:var(--text-faint);padding:40px 20px;font-size:13.5px;">No conversations match "${esc(search)}"</div>`
    : filtered.map(c => `
      <div class="chat-row ${c.id===selectedId?'selected':''}" data-action="select-chat" data-id="${c.id}">
        ${avatarHtml({ name:c.name, avatar:c.avatar, color:c.color, online:c.online })}
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="font-display" style="font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);">${esc(c.name)}</span>
            <span class="font-mono" style="font-size:10.5px;color:${c.unread>0?'var(--accent)':'var(--text-faint)'};flex-shrink:0;margin-left:6px;">${esc(c.time)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px;">
            <span style="font-size:12.5px;color:${c.typing?'var(--accent-2)':'var(--text-dim)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;font-style:${c.typing?'italic':'normal'};">
              ${c.pinned ? `<i data-lucide="pin" style="width:10px;height:10px;display:inline;transform:rotate(35deg);vertical-align:-1px;margin-right:3px;"></i>` : ''}${esc(c.lastMsg)}
            </span>
            <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
              ${c.muted ? `<i data-lucide="bell-off" style="width:12px;height:12px;color:var(--text-faint);"></i>` : ''}
              ${c.unread>0 ? `<span class="badge-unread font-mono">${c.unread}</span>` : ''}
            </div>
          </div>
        </div>
      </div>`).join('');

  return `
    <div style="padding:18px 16px 10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h1 class="font-display" style="font-size:21px;font-weight:700;letter-spacing:-0.3px;">Chats</h1>
        <div style="display:flex;gap:8px;">
          ${isMobile ? `<button class="icon-btn" data-action="toggle-theme" style="background:var(--surface-2);width:34px;height:34px;"><i data-lucide="${theme==='dark'?'sun':'moon'}" style="width:16px;height:16px;"></i></button>` : ''}
          <button class="icon-btn" style="background:var(--accent-soft);color:var(--accent);width:34px;height:34px;"><i data-lucide="circle-plus" style="width:17px;height:17px;"></i></button>
        </div>
      </div>
      <div class="search-wrap">
        <i data-lucide="search" style="width:16px;height:16px;"></i>
        <input id="chat-search" class="search-input" placeholder="Search conversations" value="${esc(search)}" />
      </div>
    </div>
    <div class="no-scrollbar" style="display:flex;gap:14px;padding:4px 16px 16px;overflow-x:auto;">
      ${stories.map(s => `
        <div style="display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;width:58px;cursor:pointer;">
          ${s.mine ? `
            <div style="position:relative;">
              ${avatarHtml({ avatar: account.initials, color: account.color, size:50 })}
              <div style="position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:9999px;background:var(--accent);display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);">
                <i data-lucide="plus" style="width:11px;height:11px;color:#fff;"></i>
              </div>
            </div>` : avatarHtml({ name:s.name, color:s.color, size:50, ring: s.viewed ? 'var(--text-faint)' : 'conic-gradient(from 0deg,#7C5CFF,#2DD4BF,#7C5CFF)' })}
          <span style="font-size:10.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px;">${s.mine?'My status':esc(s.name.split(' ')[0])}</span>

function bottomTabsHtml(){
  const tabs = [
    ['chats','message-circle','Chats'], ['status','circle-dot','Status'],
    ['calls','phone','Calls'], ['settings','settings','Settings'],
  ];
  return `<div class="bottom-tabs">${tabs.map(([id,icon,label]) => `
    <button class="bottom-tab-btn ${activeTab===id?'active':''}" data-action="switch-tab" data-tab="${id}">

/* ---------------- CONVERSATION ---------------- */
function renderConvPanel(){
  const panel = document.getElementById('conv-panel');
  if (isMobile && mobileView !== 'chat') { panel.style.display = 'none'; return; }
  if (activeTab === 'settings' && isMobile) { panel.style.display = 'none'; return; }
  panel.style.display = 'flex';

  const contact = contacts.find(c => c.id === selectedId);
  if (!contact) {
    panel.innerHTML = emptyStateHtml();
    icons();
    return;
  }

  panel.innerHTML = `
    ${convHeaderHtml(contact)}
    <div class="msg-scroll no-scrollbar" id="msg-scroll"></div>
    ${inputBarHtml()}
    <div id="info-drawer-slot"></div>
  `;
  renderMessages();
  attachComposeListeners();
  icons();
  if (showInfo) renderInfoDrawer(contact);
}

function emptyStateHtml(){
  return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-faint);">
    <div style="width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#7C5CFF,#2DD4BF);display:flex;align-items:center;justify-content:center;">
      <i data-lucide="message-circle" style="width:38px;height:38px;color:#0A0C12;"></i>
    </div>
    <div class="font-display" style="font-size:17px;font-weight:600;color:var(--text-dim);">Select a conversation</div>
    <div style="font-size:13px;">Choose a chat from the list to start messaging</div>
  </div>`;
}

function convHeaderHtml(contact){
  const isTyping = typingChat === selectedId;
  return `
    <div class="conv-header">
      ${isMobile ? `<button class="icon-btn" data-action="back-mobile" style="color:var(--text);"><i data-lucide="chevron-left" style="width:22px;height:22px;"></i></button>` : ''}
      ${avatarHtml({ name:contact.name, avatar:contact.avatar, color:contact.color, online:contact.online })}
      <div style="flex:1;min-width:0;cursor:pointer;" data-action="toggle-info">
        <div class="font-display" style="font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(contact.name)}</div>
        <div style="font-size:12px;color:${isTyping?'var(--accent-2)':(contact.online?'var(--online)':'var(--text-dim)')};font-style:${isTyping?'italic':'normal'};">
          ${isTyping ? 'typing…' : contact.group ? '12 members' : contact.online ? 'online' : (contact.lastSeen||'offline')}
        </div>
      </div>
      <div style="display:flex;gap:4px;">
        <button class="icon-btn"><i data-lucide="video" style="width:18px;height:18px;"></i></button>
        <button class="icon-btn"><i data-lucide="phone" style="width:17px;height:17px;"></i></button>
        <button class="icon-btn" data-action="toggle-info"><i data-lucide="info" style="width:18px;height:18px;"></i></button>
        ${!isMobile ? `<button class="icon-btn"><i data-lucide="more-vertical" style="width:18px;height:18px;"></i></button>` : ''}
      </div>
    </div>`;
}

function renderMessages(){
  const scroll = document.getElementById('msg-scroll');
  const contact = contacts.find(c => c.id === selectedId);
  const msgs = messagesByChat[selectedId] || [];
  scroll.innerHTML = msgs.map((m,i) => messageBubbleHtml(m, contact, i===0 || msgs[i-1].sender!==m.sender || msgs[i-1].who!==m.who)).join('')
    + (typingChat === selectedId ? typingIndicatorHtml(contact) : '');
  icons();
  scroll.scrollTop = scroll.scrollHeight;

  scroll.querySelectorAll('[data-action="play-audio"]').forEach(btn => {
    btn.addEventListener('click', () => toggleAudioPlay(Number(btn.dataset.id)));
  });
}

function typingIndicatorHtml(contact){
  return `<div class="typing-indicator rise">
    ${avatarHtml({ name:contact.name, avatar:contact.avatar, color:contact.color, size:28 })}
    <div class="typing-bubble"><span class="dot1"></span><span class="dot2"></span><span class="dot3"></span></div>
  </div>`;
}

function messageBubbleHtml(msg, contact, showAvatar){
  const isMe = msg.sender === 'me';
  const isGroup = contact.group;
  let inner = '';

  if (msg.type === 'text') {
    inner = `<div class="bubble text"><div style="font-size:14px;line-height:1.45;word-break:break-word;">${esc(msg.content)}</div>${metaHtml(msg,isMe)}</div>`;
  } else if (msg.type === 'image') {
    inner = `<div class="bubble media">
      <img src="${esc(msg.content)}" alt="shared" style="width:100%;max-width:260px;border-radius:12px;display:block;" />
      ${msg.caption ? `<div style="font-size:13px;padding:6px 6px 2px;color:${isMe?'#fff':'var(--text)'};">${esc(msg.caption)}</div>` : ''}
      <div style="padding:${msg.caption?'0 4px 2px':'4px'};">${metaHtml(msg,isMe,true)}</div>
    </div>`;
  } else if (msg.type === 'file') {
    inner = `<div class="bubble file">
      <div style="display:flex;align-items:center;gap:10px;min-width:200px;">
        <div style="width:38px;height:38px;border-radius:10px;background:${isMe?'rgba(255,255,255,0.18)':'var(--accent-soft)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i data-lucide="file" style="width:18px;height:18px;color:${isMe?'#fff':'var(--accent)'};"></i>
        </div>
        <div style="min-width:0;">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(msg.fileName)}</div>
          <div style="font-size:11px;opacity:0.75;">${esc(msg.fileSize)}</div>
        </div>
      </div>
      ${metaHtml(msg,isMe)}
    </div>`;
  } else if (msg.type === 'audio') {
    const state = audioPlaying[msg.id] || { playing:false, progress:0 };
    inner = `<div class="bubble audio">
      <div style="display:flex;align-items:center;gap:10px;min-width:190px;" id="audio-row-${msg.id}">
        <button data-action="play-audio" data-id="${msg.id}" style="width:32px;height:32px;border-radius:9999px;border:none;cursor:pointer;flex-shrink:0;background:${isMe?'rgba(255,255,255,0.22)':'var(--accent)'};color:#fff;display:flex;align-items:center;justify-content:center;">
          <i data-lucide="${state.playing?'pause':'play'}" style="width:14px;height:14px;${state.playing?'':'margin-left:1px;'}"></i>
        </button>
        <div style="--wave-active:${isMe?'#fff':'var(--accent)'};--wave-dim:${isMe?'rgba(255,255,255,.35)':'var(--surface-3)'};">
          ${waveformHtml(msg.wave, msg.id, state.progress)}
        </div>
        <span class="font-mono" style="font-size:10.5px;opacity:0.75;flex-shrink:0;">0:${String(msg.duration).padStart(2,'0')}</span>
      </div>
      ${metaHtml(msg,isMe)}
    </div>`;
  }

  const whoLabel = (!isMe && isGroup && msg.who && showAvatar) ? `<div class="font-display" style="font-size:11.5px;font-weight:600;color:${msg.color};margin-bottom:2px;margin-left:4px;">${esc(msg.who)}</div>` : '';
  const avatarSlot = (!isMe && isGroup) ? `<div style="width:28px;flex-shrink:0;">${showAvatar ? avatarHtml({ name:msg.who, color:msg.color, size:28 }) : ''}</div>` : '';

  return `<div class="msg-row ${isMe?'me':'them'}">
    <div class="msg-stack">
      ${avatarSlot}
      <div>${whoLabel}${inner}</div>
    </div>
  </div>`;
}

function metaHtml(msg, isMe, tight){
  return `<div class="msg-meta" style="${tight?'':''}">
    <span class="font-mono">${esc(msg.time)}</span>
    ${isMe ? ticksHtml(msg.status) : ''}
  </div>`;
}

/* ---------------- INPUT BAR ---------------- */
function inputBarHtml(){
  if (isRecording) {
    return `<div class="input-bar">
      <div class="rise" style="display:flex;align-items:center;gap:12px;padding:6px 4px;">
        <div class="pulse-rec" style="width:10px;height:10px;border-radius:9999px;background:var(--danger);"></div>
        <span class="font-mono" style="font-size:13.5px;flex:1;" id="record-timer">Recording… ${fmtClock(recordSeconds)}</span>
        <button data-action="cancel-record" class="icon-btn" style="display:flex;align-items:center;gap:4px;font-size:12.5px;padding:8px 10px;width:auto;">
          <i data-lucide="trash-2" style="width:15px;height:15px;"></i> Cancel
        </button>
        <button data-action="send-record" class="send-btn"><i data-lucide="send" style="width:16px;height:16px;"></i></button>
      </div>
    </div>`;
  }

  return `<div class="input-bar">
    ${showEmoji ? `<div class="popover" style="left:16px;"><div class="emoji-grid">${emojiList.map(e=>`<button data-action="insert-emoji" data-emoji="${e}">${e}</button>`).join('')}</div></div>` : ''}
    ${showAttach ? `<div class="popover attach-menu">
      <button class="attach-opt" data-action="attach-image"><span class="attach-icon-wrap" style="background:#2DD4BF22;color:#2DD4BF;"><i data-lucide="image" style="width:16px;height:16px;"></i></span>Photo & video</button>
      <button class="attach-opt" data-action="attach-file"><span class="attach-icon-wrap" style="background:#7C5CFF22;color:#7C5CFF;"><i data-lucide="file" style="width:16px;height:16px;"></i></span>Document</button>
      <button class="attach-opt" data-action="attach-image"><span class="attach-icon-wrap" style="background:#F59E0B22;color:#F59E0B;"><i data-lucide="camera" style="width:16px;height:16px;"></i></span>Camera</button>
    </div>` : ''}
    <div style="display:flex;align-items:flex-end;gap:8px;">
      <button class="icon-btn" data-action="toggle-attach"><i data-lucide="paperclip" style="width:19px;height:19px;transform:${showAttach?'rotate(45deg)':'none'};transition:transform .2s;"></i></button>
      <div class="compose-pill">
        <button class="icon-btn" data-action="toggle-emoji" style="width:28px;height:28px;"><i data-lucide="smile" style="width:19px;height:19px;"></i></button>
        <input id="compose-input" placeholder="Type a message" value="${esc(composeValue)}" autocomplete="off" />
      </div>
      ${composeValue.trim()
        ? `<button class="send-btn popIn" data-action="send"><i data-lucide="send" style="width:17px;height:17px;"></i></button>`
        : `<button class="mic-btn" data-action="record-start"><i data-lucide="mic" style="width:18px;height:18px;"></i></button>`
      }
    </div>
  </div>`;
}

function attachComposeListeners(){
  const input = document.getElementById('compose-input');
  if (!input) return;
  input.addEventListener('input', (e) => { composeValue = e.target.value; refreshSendButton(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

function refreshSendButton(){
  // Re-render just the input bar's action button area to avoid losing focus on every keystroke
  const bar = document.querySelector('.input-bar');
  if (!bar || isRecording) return;
  const trailing = bar.querySelector('.compose-pill').nextElementSibling;
  if (!trailing) return;
  if (composeValue.trim()) {
    trailing.outerHTML = `<button class="send-btn popIn" data-action="send"><i data-lucide="send" style="width:17px;height:17px;"></i></button>`;
  } else {
    trailing.outerHTML = `<button class="mic-btn" data-action="record-start"><i data-lucide="mic" style="width:18px;height:18px;"></i></button>`;
  }
  icons();
}

    </div>
    <div style="display:flex;flex-direction:column;align-items:center;padding:28px 16px;border-bottom:1px solid var(--border);">

        <span style="font-size:12.5px;color:var(--text-faint);">3</span>

        ${[1,2,3,4,5,6].map(m => `<img src="https://picsum.photos/seed/media${mediaSeed}${m}/160/160" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;" />`).join('')}

function roundActionHtml(icon, label){
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;">
    <div style="width:44px;height:44px;border-radius:9999px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;">
      <i data-lucide="${icon}" style="width:17px;height:17px;"></i>
    </div>
    <span style="font-size:11px;color:var(--text-dim);">${label}</span>

/* =====================================================================
   ACTIONS
===================================================================== */
function switchTab(tab){
  activeTab = tab;
  showInfo = false;
  if (isMobile) mobileView = 'list';
  renderApp();
}

function selectChat(id){
  selectedId = id;
  showInfo = false;
  const c = contacts.find(c => c.id === id);
  if (c) c.unread = 0;
  if (isMobile) mobileView = 'chat';
  renderApp();
}

function goBackMobile(){
  mobileView = 'list';
  showInfo = false;
  renderApp();
}

function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  renderApp();
}

function toggleInfo(){
  showInfo = !showInfo;
  if (isMobile) {
    renderApp();
  } else {
    const contact = contacts.find(c => c.id === selectedId);
    const slot = document.getElementById('info-drawer-slot');
    if (showInfo && contact) renderInfoDrawer(contact);
    else if (slot) slot.innerHTML = '';
  }
}

function toggleMute(id){
  const c = contacts.find(c => c.id === id);
  if (c) c.muted = !c.muted;
  renderApp();
}

function toggleEmoji(){ showEmoji = !showEmoji; showAttach = false; renderConvPanel(); icons(); }
function toggleAttach(){ showAttach = !showAttach; showEmoji = false; renderConvPanel(); icons(); }
function insertEmoji(e){ composeValue += e; renderConvPanel(); icons(); }

function pushMessage(msg){
  if (!messagesByChat[selectedId]) messagesByChat[selectedId] = [];
  messagesByChat[selectedId].push(msg);
  const c = contacts.find(c => c.id === selectedId);
  if (c) {
    c.lastMsg = msg.type==='text' ? msg.content : msg.type==='image' ? 'Photo' : msg.type==='audio' ? 'Voice message' : 'File';
    c.time = 'now';
  }
}

function handleSend(){
  const val = composeValue.trim();
  if (!val) return;
  pushMessage({ id: Date.now(), sender:'me', type:'text', content: val, time:'now', status:'sent' });
  composeValue = '';
  showEmoji = false;
  renderApp();
  simulateReply();
}

function simulateReply(){
  const chatId = selectedId;
  setTimeout(() => {
    typingChat = chatId;
    if (chatId === selectedId) { renderMessages(); const h = document.querySelector('.conv-header'); }
    renderConvHeaderOnly();
    setTimeout(() => {
      typingChat = null;
      const replies = ["Got it, thanks!", "Sounds perfect 👍", "Let me check and get back to you.", "Haha true", "That works for me.", "Nice, appreciate it!"];
      if (!messagesByChat[chatId]) messagesByChat[chatId] = [];
      const reply = { id: Date.now()+1, sender:'them', type:'text', content: replies[Math.floor(Math.random()*replies.length)], time:'now', status:'delivered' };
      messagesByChat[chatId].push(reply);
      const c = contacts.find(c => c.id === chatId);
      if (c) { c.lastMsg = reply.content; c.time = 'now'; }
      if (chatId === selectedId) renderMessages();
      if (activeTab === 'chats' && (!isMobile || mobileView==='list')) renderListPanel();
      renderConvHeaderOnly();
    }, 1500 + Math.random()*900);
  }, 500);
}

function renderConvHeaderOnly(){
  const contact = contacts.find(c => c.id === selectedId);
  if (!contact) return;
  const header = document.querySelector('.conv-header');
  if (header) { header.outerHTML = convHeaderHtml(contact); icons(); }
}

function addImageMessage(){
  pushMessage({ id: Date.now(), sender:'me', type:'image', content:`https://picsum.photos/seed/${Date.now()}/480/320`, time:'now', status:'sent' });
  showAttach = false;
  renderApp();
}
function addFileMessage(){
  pushMessage({ id: Date.now(), sender:'me', type:'file', fileName:'Project_Brief_Final.docx', fileSize:'1.8 MB', time:'now', status:'sent' });
  showAttach = false;
  renderApp();
}

function startRecording(){
  isRecording = true;
  recordSeconds = 0;
  renderConvPanel();
  icons();
  recordTimer = setInterval(() => {
    recordSeconds += 1;
    const el = document.getElementById('record-timer');
    if (el) el.textContent = `Recording… ${fmtClock(recordSeconds)}`;
  }, 1000);
}
function stopRecording(send){
  clearInterval(recordTimer);
  if (send && recordSeconds > 0) {
    const barCount = Math.min(28, Math.max(10, recordSeconds*2));
    const wave = Array.from({length:barCount}, () => Math.round(Math.random()*20+4));
    pushMessage({ id: Date.now(), sender:'me', type:'audio', duration: recordSeconds, wave, time:'now', status:'sent' });
  }
  isRecording = false;
  recordSeconds = 0;
  renderApp();
}

function toggleAudioPlay(msgId){
  const msgs = messagesByChat[selectedId] || [];
  const msg = msgs.find(m => m.id === msgId);
  if (!msg) return;
  const state = audioPlaying[msgId] || { playing:false, progress:0, interval:null };

  if (state.playing) {
    clearInterval(state.interval);
    state.playing = false;
    audioPlaying[msgId] = state;
    renderMessages();
    return;
  }

  state.playing = true;
  const total = msg.duration * 10;
  let tick = Math.round(state.progress * total);
  state.interval = setInterval(() => {
    tick += 1;
    state.progress = tick / total;
    updateWaveformDom(msgId, state.progress);
    const btn = document.querySelector(`#audio-row-${msgId} [data-action="play-audio"] i`);
    if (tick >= total) {
      clearInterval(state.interval);
      state.playing = false;
      state.progress = 0;
      audioPlaying[msgId] = state;
      renderMessages();
    }
  }, 100);
  audioPlaying[msgId] = state;
  renderMessages();
}

function updateWaveformDom(msgId, progress){
  const wave = document.getElementById(`wave-${msgId}`);
  if (!wave) return;
  const bars = wave.querySelectorAll('.wave-bar');
  bars.forEach((b,i) => {
    const active = i/bars.length <= progress;
    b.style.background = active ? 'var(--wave-active)' : 'var(--wave-dim)';
  });
}

/* =====================================================================
   EVENT DELEGATION
===================================================================== */
document.addEventListener('click', (e) => {
  // onboarding buttons
  if (e.target.closest('#btn-send-otp')) return submitPhone();
  if (e.target.closest('#btn-verify-otp')) return verifyOtp();
  if (e.target.closest('#btn-resend-otp')) return resendOtp();
  if (e.target.closest('#btn-back-phone')) { onboardStep='phone'; onboardError=''; renderOnboarding(); return; }
  if (e.target.closest('#btn-finish-profile')) return finishProfile();
  const colorChoice = e.target.closest('.color-choice');
  if (colorChoice) { profileColorDraft = colorChoice.dataset.color; renderOnboarding(); return; }

  // country picker
  if (e.target.closest('#country-picker-close')) { showCountryPicker = false; renderOnboarding(); return; }
  const countryRow = e.target.closest('.country-picker-row');
  if (countryRow) {
    const iso = countryRow.dataset.iso;
    const c = countryByIso(iso);
    selectedCountry = { code: c[2], iso: c[0] };
    showCountryPicker = false;
    renderOnboarding();
    return;
  }
  if (e.target.id === 'country-picker-overlay') { showCountryPicker = false; renderOnboarding(); return; }

  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  switch(action){
    case 'switch-tab': switchTab(target.dataset.tab); break;
    case 'select-chat': selectChat(Number(id)); break;
    case 'back-mobile': goBackMobile(); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'toggle-info': toggleInfo(); break;
    case 'toggle-mute': toggleMute(Number(id)); break;
    case 'toggle-emoji': toggleEmoji(); break;
    case 'toggle-attach': toggleAttach(); break;
    case 'insert-emoji': insertEmoji(target.dataset.emoji); break;
    case 'attach-image': addImageMessage(); break;
    case 'attach-file': addFileMessage(); break;
    case 'send': handleSend(); break;
    case 'record-start': startRecording(); break;
    case 'cancel-record': stopRecording(false); break;
    case 'send-record': stopRecording(true); break;
    case 'toggle-notif': settingsState.notif = !settingsState.notif; renderListPanel(); icons(); break;
    case 'toggle-receipts': settingsState.readReceipts = !settingsState.readReceipts; renderListPanel(); icons(); break;
    case 'log-out': logOut(); break;
    default:
      if (action && action.startsWith('toggle-mute-')) toggleMute(Number(action.replace('toggle-mute-','')));
  }
});

function logOut(){
  firebase.auth().signOut().catch(()=>{});
  confirmationResult = null;
  resetRecaptcha();
  account = null;
  onboardStep = 'phone';
  phoneDigits = '';
  profileNameDraft = '';
  onboardError = '';
  document.getElementById('app-root').classList.remove('active');
  document.getElementById('onboarding-screen').style.display = 'flex';
  renderOnboarding();
}

document.addEventListener('input', (e) => {
  if (e.target.id === 'name-input') {
    profileNameDraft = e.target.value;
    const avatarSlot = document.querySelector('.onboard-card > div[style*="justify-content:center"]');
    if (avatarSlot) avatarSlot.innerHTML = avatarHtml({ name: profileNameDraft || '?', color: profileColorDraft, size:84 });
    document.querySelectorAll('.color-choice').forEach(el => {
      el.textContent = profileNameDraft ? initialsOf(profileNameDraft) : '';
    });
  }
  if (e.target.id === 'country-search-input') {
    countrySearch = e.target.value;
    const list = document.querySelector('.country-picker-list');
    if (list) {
      const q = countrySearch.trim().toLowerCase();
      const filtered = COUNTRIES.filter(c => !q || c[1].toLowerCase().includes(q) || c[2].includes(q))
        .slice().sort((a,b) => a[1].localeCompare(b[1]));
      list.innerHTML = filtered.length ? filtered.map(c => `
        <div class="country-picker-row ${c[0]===selectedCountry.iso?'selected':''}" data-iso="${c[0]}">
          <span style="font-size:20px;">${isoToFlag(c[0])}</span>
          <span style="flex:1;font-size:13.5px;">${esc(c[1])}</span>
          <span class="font-mono" style="font-size:12.5px;color:var(--text-dim);">${esc(c[2])}</span>
        </div>`).join('') : `<div style="text-align:center;color:var(--text-faint);padding:30px 10px;font-size:13px;">No countries match "${esc(countrySearch)}"</div>`;
    }
  }
});

window.addEventListener('resize', () => {
  const nowMobile = window.innerWidth < 860;
  if (nowMobile !== isMobile) {
    isMobile = nowMobile;
    if (!isMobile) mobileView = 'chat';
    if (account) renderApp();
  }
});

/* =====================================================================
   INIT
===================================================================== */
renderOnboarding();
icons();
</script>
