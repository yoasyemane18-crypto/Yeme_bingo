function rg(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function cardFor(n,seed){var r=rng(seed*1000+n*7919+13),c=[];for(var i=0;i<5;i++)c.push(shuf(rg(i*15+1,i*15+15),r).slice(0,5));c[2][2]=0;return c}
function cellsHTML(card,m,tag,k){var h='';for(var r=0;r<5;r++)for(var c=0;c<5;c++){var n=card[c][r],cl='cell';if(!n)cl+=' free';else if(m&&m[c+','+r])cl+=' on';
  h+='<'+tag+' class="'+cl+'"'+(tag==='button'?' data-c="'+c+'" data-r="'+r+'" aria-label="'+(n?'BINGO'[c]+' '+n:'Free space')+'"':'')+'>'+(n||'★')+'</'+tag+'>'}return h}
var GOALS=(function(){var L=[],i,j,a,b,d1=[],d2=[];for(i=0;i<5;i++){a=[];b=[];for(j=0;j<5;j++){a.push([j,i]);b.push([i,j])}L.push(a,b)}
  for(j=0;j<5;j++){d1.push([j,j]);d2.push([j,4-j])}L.push(d1,d2);
  var cl=function(f){var o=[];for(var c=0;c<5;c++)for(var r=0;r<5;r++)if(f(c,r))o.push([c,r]);return o};
  return [{n:'Any Line',s:L},{n:'Four Corners',s:[cl(function(c,r){return c%4===0&&r%4===0})]},{n:'Both Diagonals',s:[d1.concat(d2)]},{n:'Plus Sign',s:[cl(function(c,r){return c===2||r===2})]},{n:'Letter T',s:[cl(function(c,r){return r===0||c===2})]},{n:'Full House',s:[cl(function(){return true})]}]})();

function loop(){var n=now(),el=n-G.start-LEAD,c=el<0?0:Math.min(75,Math.floor(el/INT)+1),ch=false,rd=$('rd');

  var h='<div id="adm"><div class="tabs"><button data-t="pay" aria-pressed="'+(AT==='pay')+'">Payments'+(pend.length?' ('+pend.length+')':'')+'</button><button data-t="wd" aria-pressed="'+(AT==='wd')+'">Withdrawals'+(pw.length?' ('+pw.length+')':'')+'</button><button data-t="users" aria-pressed="'+(AT==='users')+'">Users ('+Object.keys(us).length+')</button><button data-t="out">Logout</button></div><div id="amsg" class="err" role="status"></div>';
  if(AT==='pay'){h+='<h4>Pending ('+pend.length+') · Approved total '+tot+' birr</h4>';if(!pend.length)h+='<p class="note">No pending payments.</p>';
    pend.forEach(function(x){h+='<div class="ac"><b>'+esc(x.u)+'</b> · '+esc((us[x.u]||{}).phone||'–')+'<small>'+when(x.ts)+'</small>Receipt: '+esc(x.rid)+'<small>'+(/^https:\/\//.test(x.link)?'<a href="'+esc(x.link)+'" target="_blank" rel="noopener noreferrer">'+esc(x.link)+'</a>':esc(x.link))+'</small><div class="ar"><input id="amt-'+x.id+'" type="number" inputmode="numeric" min="1" value="'+x.amt+'" aria-label="Amount in birr"><button class="ab ok" data-a="ok" data-id="'+x.id+'">Approve</button><button class="ab no" data-a="no" data-id="'+x.id+'">Decline</button></div></div>'});
    var hi=ps.filter(function(x){return x.st!=='pending'}).slice(-15).reverse();if(hi.length)h+='<h4>History</h4><ul class="txl">'+hi.map(function(x){return '<li><span>'+esc(x.u)+' · '+x.amt+' birr</span><b class="'+STX[x.st][1]+'">'+STX[x.st][0]+'</b></li>'}).join('')+'</ul>'}
  else if(AT==='wd'){h+='<h4>Withdrawals pending ('+pw.length+')</h4>';if(!pw.length)h+='<p class="note">No pending withdrawals.</p>';
    pw.forEach(function(x){h+='<div class="ac"><b>'+esc(x.u)+'</b> · '+esc((us[x.u]||{}).phone||'–')+'<small>'+when(x.ts)+'</small>Send <b>'+x.amt+' birr</b> to Telebirr <b>'+esc(x.acct)+'</b><div class="ar"><button class="ab ok" data-a="wok" data-id="'+x.id+'">Mark paid</button><button class="ab no" data-a="wno" data-id="'+x.id+'">Decline &amp; refund</button></div></div>'})}
  else{h+='<input class="sq" id="sq" placeholder="Search username or phone" aria-label="Search users">';var ks=Object.keys(us);if(!ks.length)h+='<p class="note">No registered users yet.</p>';
    ks.forEach(function(n){var r=us[n];h+='<div class="ac uc" data-n="'+esc((n+' '+r.phone).toLowerCase())+'"><b>'+esc(n)+'</b> · '+esc(r.phone)+'<br>Wallet: <b>'+bal(r)+' birr</b><div class="ar"><input type="number" inputmode="numeric" min="1" placeholder="birr" aria-label="Amount for '+esc(n)+'"><button class="ab ok" data-a="add" data-u="'+esc(n)+'">Add</button><button class="ab" data-a="sub" data-u="'+esc(n)+'" style="background:#b8860b">Deduct</button></div><div class="ar"><button class="ab no" data-a="del" data-u="'+esc(n)+'">Delete user</button></div></div>'})}
  return h+'</div>'}
function rr(){var y=scrollY;route();scrollTo(0,y)}
function bindForms(){
  var lf=$('lf');if(lf)lf.onsubmit=async function(e){e.preventDefault();var n=$('lu').value.trim(),p=$('lp').value,us=users(),k=Object.keys(us).filter(function(x){return x.toLowerCase()===n.toLowerCase()})[0];
    if(!n||!p){$('err').textContent='Enter your username and password.';return}
    if(!k||us[k].pw!==await hash(p)){$('err').textContent='Wrong username or password.';return}ls('sb_session',k);go('rooms')};
  var rf=$('rf');if(rf)rf.onsubmit=async function(e){e.preventDefault();var n=$('ru').value.trim(),ph=$('rph').value.replace(/[\s-]/g,''),p=$('rp').value,p2=$('rp2').value,us=users(),er='';
    if(n.length<3)er='Username must be at least 3 characters.';
    else if(Object.keys(us).some(function(x){return x.toLowerCase()===n.toLowerCase()}))er='That username is taken.';
    else if(!/^\+?\d{9,13}$/.test(ph))er='Enter a valid phone number.';
    else if(p.length<4)er='Password must be at least 4 characters.';
    else if(p!==p2)er='Passwords do not match.';
    if(er){$('err').textContent=er;return}
    if(!await newUser(n,{phone:ph,pw:await hash(p),wallet:0,tx:[]})){$('err').textContent='That username is taken.';return}ls('sb_session',n);go('rooms')};
  var al=$('al');if(al)al.onsubmit=function(e){e.preventDefault();if(sha256('sb:admin:'+$('ae').value.trim().toLowerCase()+':'+$('ap').value)!==ADMIN_HASH){$('err').textContent='Wrong email or password.';return}ls('sb_as',ADMIN_HASH);route()};
  var u=session(),bdp=$('bdp'),bwd=$('bwd');
  if(bdp){var shw=function(){$('dpp').hidden=PANEL!=='d';$('wdp').hidden=PANEL!=='w'};shw();
    bdp.onclick=function(){PANEL=PANEL==='d'?null:'d';shw()};bwd.onclick=function(){PANEL=PANEL==='w'?null:'w';shw()};
    $('pd').onclick=function(){var m=$('rl').value.trim().match(/^(?:https?:\/\/transactioninfo\.ethiotelecom\.et\/receipt\/)?([A-Za-z0-9]{8,14})\/?$/),ms=$('msg'),amt=Math.floor(Number($('ra').value));
      if(!(amt>=PAY_BIRR)){ms.textContent='Payment below '+PAY_BIRR+' birr is not confirmed.';return}
      if(!m){ms.textContent='Enter the receipt link or number from your Telebirr SMS.';return}
      var id=m[1].toUpperCase();if(pays().some(function(x){return x.rid===id&&x.st!=='declined'})){ms.textContent='This receipt was already submitted.';return}
      addPay({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),u:u,amt:amt,rid:id,link:$('rl').value.trim(),ts:Date.now(),st:'pending'}).then(function(){PANEL=null;route();note('Payment received. The admin will review it.')})};
    $('wsub').onclick=function(){var amt=Math.floor(Number($('wa').value)),ac=$('wt').value.replace(/[\s-]/g,''),ms=$('msg'),r=users()[u],b=$('wsub');
      if(!(amt>=PAY_BIRR)){ms.textContent='Minimum withdrawal is '+PAY_BIRR+' birr.';return}
      if(!/^(\+?251|0)9\d{8}$/.test(ac)){ms.textContent='Enter a valid Telebirr account number (09XXXXXXXX).';return}
      if(amt>bal(r)){ms.textContent='You cannot withdraw more than your wallet balance.';return}
      b.disabled=true;setBal(users(),u,bal(r)-amt,'Withdrawal',-amt,function(ok){if(!ok){b.disabled=false;ms.textContent='You cannot withdraw more than your wallet balance.';return}
        addWd({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),u:u,amt:amt,acct:ac,ts:Date.now(),st:'pending'}).then(function(){PANEL=null;route();note('✔ Withdrawal requested. The admin will send '+amt+' birr to '+ac+'.')})})}}
  var a=$('adm');if(!a)return;var sq=$('sq');
  if(sq)sq.oninput=function(){var q=sq.value.trim().toLowerCase();document.querySelectorAll('.uc').forEach(function(c){c.hidden=!!q&&c.dataset.n.indexOf(q)<0})};
  a.onclick=function(e){var b=e.target.closest('button');if(!b)return;var t=b.dataset.t,k=b.dataset.a,m=$('amsg');m.textContent='';
    if(t){if(t==='out')ls('sb_as',false);else AT=t;rr();return}
    if(k==='wok'||k==='wno'){var wl=wds(),w=wl.filter(function(x){return x.id===b.dataset.id})[0];if(!w||w.st!=='pending')return;
      decide('wds','sb_wd',wl,w,k==='wok'?'approved':'declined',0,k==='wno'?function(){var u3=users();if(u3[w.u])setBal(u3,w.u,bal(u3[w.u])+w.amt,'Withdrawal refund',w.amt)}:null);rr();return}
    if(k==='ok'||k==='no'){var ps=pays(),r=ps.filter(function(x){return x.id===b.dataset.id})[0];if(!r||r.st!=='pending')return;
      if(k==='ok'){var amt=Math.floor(Number($('amt-'+r.id).value)),us=users();if(!(amt>0)){m.textContent='Enter a valid amount.';return}if(!us[r.u]){m.textContent='This user no longer exists.';return}
        decide('pays','sb_pay',ps,r,'approved',amt,function(){setBal(us,r.u,bal(us[r.u])+amt,'Top-up',amt)})}else decide('pays','sb_pay',ps,r,'declined',0);
      rr();return}
    var n=b.dataset.u,us2=users();if(!us2[n])return;
    if(k==='del'){if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to confirm';return}delUser(us2,n);if(session()===n)ls('sb_session',null);rr();return}
    var v=Math.floor(Number(b.parentNode.querySelector('input').value));if(!(v>0)){m.textContent='Enter an amount.';return}
    if(k==='sub'){if(v>bal(us2[n])){m.textContent='Not enough balance to deduct.';return}setBal(us2,n,bal(us2[n])-v,'Admin deduction',-v)}else setBal(us2,n,bal(us2[n])+v,'Admin credit',v);rr()}}
function tick(){var el=$('cd');if(!el)return;var R=rcyc();el.textContent=R.n<R.st?mmss(R.st-R.n):mmss(R.s+RCYC-R.n);$('cdl').textContent=R.n<R.st?'Rooms are open · join now':'Round running · next rooms open in'}
setInterval(function(){tick();if(location.hash==='#rooms')rtick()},1000);

  $('view').innerHTML=P[v]();menu(v);bindForms();$('over').classList.remove('show');
  if(v==='rooms'){RP=null;rdraw()}if(v==='game')initGame();tick();scrollTo(0,0)}
try{history.scrollRestoration='manual'}catch(e){}
window.addEventListener('hashchange',route);
$('view').innerHTML='<p class="note" style="padding:60px 0">Connecting…</p>';initFB(function(){READY=true;route()});
})();
